version: '3.8'

services:
  node-1:
    build: { context: ., dockerfile: Dockerfile }
    container_name: horizon-node-1
    ports: ["9001:9001"]
    environment: [NODE_ID=node-1, PORT=9001]
    volumes: ["./data/node1:/app/data"]
    restart: unless-stopped

  node-2:
    build: .
    container_name: horizon-node-2
