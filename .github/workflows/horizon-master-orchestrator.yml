name: Horizon Angel Master Orchestrator

on:
  push:
    branches: [ main, mine, staging ]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  master-orchestrate:
    runs-on: ubuntu-latest
    name: Horizon Angel Master Orchestrator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # ==========================================
      # 1. تشخیص خودکار ساختار پروژه
      # ==========================================
      - name: Auto‑detect project structure
        id: detect
        run: |
          echo "🔍 Scanning project structure..."

          # پیدا کردن main.go
          MAIN_PATH=$(find . -name "main.go" -type f | head -n 1)
          if [ -z "$MAIN_PATH" ]; then
            echo "⚠️ No main.go found. Generating default..."
            mkdir -p cmd
            cat > cmd/main.go <<'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("🌅 Horizon Angel is alive!") }
          EOF
            MAIN_PATH="cmd/main.go"
          fi
          echo "✅ main.go found at: $MAIN_PATH"
          echo "main_path=$MAIN_PATH" >> $GITHUB_OUTPUT

          # پیدا کردن go.mod
          if [ ! -f "go.mod" ]; then
            echo "⚠️ go.mod not found. Generating..."
            go mod init horizon-angel
          fi

          # شناسایی نوع سرویس
          REPO_NAME=$(basename "${{ github.repository }}")
          echo "📁 Repository: $REPO_NAME"
          if [[ "$REPO_NAME" == *"license"* ]]; then
            echo "deploy_type=internal" >> $GITHUB_OUTPUT
          elif [[ "$REPO_NAME" == *"switch"* ]]; then
            echo "deploy_type=internal" >> $GITHUB_OUTPUT
          elif [[ "$REPO_NAME" == *"dashboard"* ]] || [[ "$REPO_NAME" == *"panel"* ]]; then
            echo "deploy_type=public" >> $GITHUB_OUTPUT
          else
            echo "deploy_type=public" >> $GITHUB_OUTPUT
          fi

      # ==========================================
      # 2. نصب وابستگی‌ها و بیلد
      # ==========================================
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          go mod tidy

      - name: Build project
        run: |
          echo "🛠️ Building project..."
          go build -o horizon ${{ steps.detect.outputs.main_path }}

      # ==========================================
      # 3. اجرای ابزارهای تول‌بوکس (اگر وجود داشته باشند)
      # ==========================================
      - name: Run Toolbox tools (if any)
        run: |
          if [ -d "tools" ]; then
            echo "🧰 Running Toolbox scripts..."
            for script in tools/*.sh; do
              if [ -f "$script" ]; then
                chmod +x "$script"
                echo "▶️ Running $script"
                bash "$script"
              fi
            done
          else
            echo "ℹ️ No Toolbox directory found. Skipping."
          fi

      # ==========================================
      # 4. دیپلوی روی لیارا بر اساس نوع سرویس
      # ==========================================
      - name: Deploy to Liara
        if: env.LIARA_TOKEN != ''
        run: |
          DEPLOY_TYPE="${{ steps.detect.outputs.deploy_type }}"
          echo "🚀 Deploying as type: $DEPLOY_TYPE"

          npm install -g @liara/cli

          if [ "$DEPLOY_TYPE" == "public" ]; then
            liara deploy --api-token="$LIARA_TOKEN" --public
          elif [ "$DEPLOY_TYPE" == "internal" ]; then
            liara deploy --api-token="$LIARA_TOKEN" --internal
          else
            liara deploy --api-token="$LIARA_TOKEN"
          fi

      # ==========================================
      # 5. گزارش نهایی
      # ==========================================
      - name: Final report
        run: |
          echo "============================================"
          echo "🎉 Horizon Angel Master Orchestration Complete!"
          echo "============================================"
          echo "✅ Repository: ${{ github.repository }}"
          echo "✅ Go version: ${{ env.GO_VERSION }}"
          echo "✅ main.go path: ${{ steps.detect.outputs.main_path }}"
          echo "✅ Deploy type: ${{ steps.detect.outputs.deploy_type }}"
          echo "✅ Toolbox: $([ -d 'tools' ] && echo 'Executed' || echo 'Skipped')"
          echo "✅ Liara deploy: $([ -n '${{ env.LIARA_TOKEN }}' ] && echo 'Completed' || echo 'Skipped (no token)')"
          echo "============================================"