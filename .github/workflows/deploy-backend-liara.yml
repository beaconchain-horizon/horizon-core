name: Horizon Core · Backend → Liara

on:
  push:
    branches:
      - main
    paths:
      - "cmd/api/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.backend"
      - "liara-backend.json"
      - ".github/workflows/deploy-backend-liara.yml"

  workflow_dispatch:

concurrency:
  group: horizon-core-backend-liara-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.4"
  NODE_VERSION: "22"
  LIARA_CLI_VERSION: "9.5.1"

  CGO_ENABLED: "0"
  GOOS: "linux"
  GOARCH: "amd64"
  GOTOOLCHAIN: "local"
  GOWORK: "off"

  BACKEND_APP: "horizon-backend"
  BACKEND_PORT: "8080"
  HEALTH_URL: "https://horizon-backend.liara.run/api/v1/health"

jobs:

  # ============================================================
  # 1. VALIDATION
  # ============================================================
  validate:
    name: Validate · Horizon Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Toolchain Information
        run: |
          set -euo pipefail

          go version
          go env \
            GOROOT \
            GOPATH \
            GOMODCACHE \
            GOCACHE \
            GOOS \
            GOARCH \
            CGO_ENABLED \
            GOTOOLCHAIN \
            GOWORK

      - name: Verify Backend Layout
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "go.mod"
            "go.sum"
            "cmd/api/main.go"
            "Dockerfile.backend"
            "liara-backend.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing backend file: $file"
              exit 1
            fi
          done

          echo "Backend repository layout verified."

      - name: Verify Backend Entrypoint
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'func main()' cmd/api/main.go || {
            echo "::error::cmd/api/main.go has no main function."
            exit 1
          }

          grep -q '/api/v1/health' cmd/api/main.go || {
            echo "::error::Backend health endpoint is missing."
            exit 1
          }

          grep -q 'DATABASE_URL' cmd/api/main.go || {
            echo "::error::DATABASE_URL integration is missing."
            exit 1
          }

          echo "Backend entrypoint verified."

      - name: Verify Liara Configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q '"app": "horizon-backend"' liara-backend.json || {
            echo "::error::Wrong Liara backend app."
            exit 1
          }

          grep -q '"platform": "docker"' liara-backend.json || {
            echo "::error::Backend must deploy through Docker."
            exit 1
          }

          grep -q '"port": 8080' liara-backend.json || {
            echo "::error::Backend port must be 8080."
            exit 1
          }

          echo "Liara backend configuration verified."

      - name: Download Dependencies
        run: |
          go mod download

      - name: Verify Modules
        run: |
          go mod verify

      - name: Run Tests
        run: |
          go test -count=1 ./...

      - name: Run Vet
        run: |
          go vet ./...

      - name: Build Backend
        run: |
          set -euo pipefail

          mkdir -p build

          CGO_ENABLED="${CGO_ENABLED}" \
          GOOS="${GOOS}" \
          GOARCH="${GOARCH}" \
          go build \
            -trimpath \
            -buildvcs=false \
            -p=2 \
            -ldflags="-s -w" \
            -o build/horizon-backend \
            ./cmd/api

          test -s build/horizon-backend

          ls -lh build/horizon-backend

      - name: Docker Build Validation
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --file Dockerfile.backend \
            --tag horizon-backend-ci:latest \
            .

      - name: Validation Summary
        if: success()
        run: |
          {
            echo "## ✅ Horizon Backend Validation"
            echo ""
            echo "- Go: ${GO_VERSION}"
            echo "- Entrypoint: cmd/api"
            echo "- Tests: PASS"
            echo "- Vet: PASS"
            echo "- Backend build: PASS"
            echo "- Docker build: PASS"
            echo "- Target: ${BACKEND_APP}"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 2. LIARA DEPLOY
  # ============================================================
  deploy:
    name: Deploy · horizon-backend → Liara
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Liara CLI
        run: |
          npm install -g @liara/cli@${{ env.LIARA_CLI_VERSION }}

      - name: Verify Liara CLI
        run: |
          liara --version

      - name: Verify Liara Token
        shell: bash
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${LIARA_API_TOKEN:-}" ]]; then
            echo "::error::LIARA_API_TOKEN is missing."
            exit 1
          fi

          echo "Liara authentication secret is available."

      - name: Deploy Backend
        shell: bash
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          liara deploy \
            --app="${BACKEND_APP}" \
            --api-token="$LIARA_API_TOKEN" \
            --no-app-logs \
            --dockerfile="Dockerfile.backend" \
            --platform=docker

      - name: Wait for Backend
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for backend to become healthy..."

          for attempt in $(seq 1 30); do
            echo "Health check attempt ${attempt}/30"

            response="$(curl -ksS \
              --connect-timeout 5 \
              --max-time 10 \
              "$HEALTH_URL" || true)"

            echo "Response: $response"

            if echo "$response" | grep -q '"status":"online"' \
              && echo "$response" | grep -q '"service":"horizon-backend"'; then

              echo "Backend is healthy."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Backend health check failed."
          exit 1

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## 🚀 Horizon Backend · Liara"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| horizon-backend | ✅ deployed |"
            echo "| Go 1.24 | ✅ |"
            echo "| Docker | ✅ |"
            echo "| Health | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 3. FINAL STATUS
  # ============================================================
  final:
    name: Backend Deployment Status
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy
    if: always()

    steps:

      - name: Publish Final Status
        shell: bash
        run: |
          {
            echo "## Horizon Core · Backend Final Status"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| Liara Deploy | ${{ needs.deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "::error::Backend validation failed."
            exit 1
          fi

          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "::error::Backend deployment failed."
            exit 1
          fi

          echo "Horizon Backend deployment completed successfully."
