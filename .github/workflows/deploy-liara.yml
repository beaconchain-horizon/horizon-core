name: Horizon Core · Liara Production

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "liara.json"
  workflow_dispatch:

concurrency:
  group: horizon-core-liara-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.4"
  NODE_VERSION: "22"
  LIARA_CLI_VERSION: "9.5.1"

  CGO_ENABLED: "0"
  GOOS: "linux"
  GOARCH: "amd64"
  GOTOOLCHAIN: "local"
  GOWORK: "off"

jobs:

  # ============================================================
  # VALIDATE
  # ============================================================
  validate:
    name: Validate · Go 1.24 · Horizon Switch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Toolchain Information
        run: |
          set -euo pipefail

          echo "=== Go ==="
          go version

          echo "=== Environment ==="
          go env GOROOT GOPATH GOMODCACHE GOCACHE
          go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN GOWORK

      - name: Verify Repository Layout
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "go.mod"
            "go.sum"
            "Dockerfile"
            "liara.json"
          )

          required_dirs=(
            "cmd/switch"
            "internal"
            "config"
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing required file: $path"
              exit 1
            fi
          done

          for path in "${required_dirs[@]}"; do
            if [[ ! -d "$path" ]]; then
              echo "::error::Missing required directory: $path"
              exit 1
            fi
          done

          echo "Repository layout verified."

      - name: Verify Liara Configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q '"app": "horizon-switch"' liara.json || {
            echo "::error::liara.json does not target horizon-switch"
            exit 1
          }

          grep -q '"platform": "docker"' liara.json || {
            echo "::error::liara.json platform must be docker"
            exit 1
          }

          grep -q '"port": 8080' liara.json || {
            echo "::error::liara.json port must be 8080"
            exit 1
          }

          echo "Liara configuration verified."

      - name: Download Dependencies
        run: |
          go mod download

      - name: Verify Modules
        run: |
          go mod verify

      - name: Run Tests
        run: |
          go test -count=1 ./...

      - name: Run Vet
        run: |
          go vet ./...

      - name: Build Horizon Switch
        run: |
          set -euo pipefail

          mkdir -p build

          CGO_ENABLED="${CGO_ENABLED}" \
          GOOS="${GOOS}" \
          GOARCH="${GOARCH}" \
          go build \
            -trimpath \
            -buildvcs=false \
            -p=2 \
            -ldflags="-s -w" \
            -o build/horizon-switch \
            ./cmd/switch

          test -s build/horizon-switch

          ls -lh build/horizon-switch

      - name: Validate Docker Builder
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --file Dockerfile \
            --target builder \
            --tag horizon-core-switch-ci:latest \
            .

      - name: Validation Summary
        if: success()
        run: |
          {
            echo "## ✅ Horizon Core Validation"
            echo ""
            echo "- Go: ${GO_VERSION}"
            echo "- Tests: PASS"
            echo "- Vet: PASS"
            echo "- Switch build: PASS"
            echo "- Docker builder: PASS"
            echo "- Target app: horizon-switch"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # DEPLOY TO LIARA
  # ============================================================
  deploy:
    name: Deploy · horizon-switch → Liara
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Liara CLI
        run: |
          npm install -g @liara/cli@${{ env.LIARA_CLI_VERSION }}

      - name: Verify Liara CLI
        run: |
          liara --version

      - name: Verify Liara Secret
        shell: bash
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${LIARA_API_TOKEN:-}" ]]; then
            echo "::error::LIARA_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Liara API token is available."

      - name: Deploy Horizon Switch
        shell: bash
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          liara deploy \
            --app="horizon-switch" \
            --api-token="$LIARA_API_TOKEN" \
            --no-app-logs \
            --dockerfile="Dockerfile" \
            --platform=docker

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## 🚀 Horizon Core · Liara"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| horizon-switch | ✅ deployed |"
            echo "| Docker | ✅ |"
            echo "| Go 1.24 | ✅ |"
            echo "| Validation | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # FINAL STATUS
  # ============================================================
  final:
    name: Final Deployment Status
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy
    if: always()

    steps:
      - name: Publish Final Status
        shell: bash
        run: |
          {
            echo "## Horizon Core · Final Status"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| Liara Deploy | ${{ needs.deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "::error::Validation failed."
            exit 1
          fi

          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "::error::Liara deployment failed."
            exit 1
          fi

          echo "Horizon Core deployment completed successfully."
