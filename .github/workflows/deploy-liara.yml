name: Horizon Core · Deploy to Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: horizon-core-liara-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.4"
  NODE_VERSION: "22"
  LIARA_CLI_VERSION: "9.5.1"
  CGO_ENABLED: "0"
  GOOS: "linux"
  GOARCH: "amd64"
  GOTOOLCHAIN: "local"
  GOWORK: "off"

jobs:

  # =========================================================
  # 1. VALIDATION
  # =========================================================
  validate:
    name: Validate Horizon Core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go 1.24.4
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Show Toolchain
        run: |
          set -eux
          go version
          go env GOROOT GOPATH GOMODCACHE GOCACHE
          go env GOOS GOARCH CGO_ENABLED GOTOOLCHAIN GOWORK

      - name: Verify Required Files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "go.mod"
            "go.sum"
            "Dockerfile"
            "cmd/switch"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "::error::Missing required path: $file"
              exit 1
            fi
          done

          echo "Required Switch files verified."

      - name: Verify Backend Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "Dockerfile.backend" ]]; then
            echo "::error::Dockerfile.backend is missing from the repository."
            echo "::error::Backend deployment is intentionally stopped."
            echo "Create Dockerfile.backend before enabling horizon-backend deployment."
            exit 1
          fi

          echo "Dockerfile.backend verified."

      - name: Download Go Modules
        run: |
          go mod download

      - name: Verify Module Graph
        run: |
          go mod verify

      - name: Run Go Tests
        run: |
          go test -count=1 ./...

      - name: Run Go Vet
        run: |
          go vet ./...

      - name: Build Switch Binary
        run: |
          mkdir -p build

          CGO_ENABLED="${CGO_ENABLED}" \
          GOOS="${GOOS}" \
          GOARCH="${GOARCH}" \
          go build \
            -trimpath \
            -buildvcs=false \
            -p=2 \
            -ldflags="-s -w" \
            -o build/horizon-switch \
            ./cmd/switch

          ls -lh build/horizon-switch

      - name: Validate Dockerfile Syntax
        run: |
          docker build \
            --pull \
            --file Dockerfile \
            --target builder \
            --tag horizon-core-switch-validation:ci \
            .

      - name: Validation Summary
        if: success()
        run: |
          echo "## Horizon Core Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Go 1.24.4" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ go mod download" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ go mod verify" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ go test ./..." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ go vet ./..." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ horizon-switch build" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Docker builder validation" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 2. DEPLOY SWITCH
  # =========================================================
  deploy-switch:
    name: Deploy horizon-switch
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Liara CLI
        run: |
          npm install -g @liara/cli@${{ env.LIARA_CLI_VERSION }}

      - name: Verify Liara CLI
        run: |
          liara --version

      - name: Deploy Switch to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          liara deploy \
            --app="horizon-switch" \
            --api-token="$LIARA_API_TOKEN" \
            --no-app-logs \
            --dockerfile="Dockerfile" \
            --platform=docker

      - name: Switch Deployment Summary
        if: success()
        run: |
          echo "## horizon-switch" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Liara deployment command completed successfully." >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 3. DEPLOY BACKEND
  # =========================================================
  deploy-backend:
    name: Deploy horizon-backend
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy-switch
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Liara CLI
        run: |
          npm install -g @liara/cli@${{ env.LIARA_CLI_VERSION }}

      - name: Verify Backend Dockerfile
        run: |
          set -euo pipefail

          test -f Dockerfile.backend || {
            echo "::error::Dockerfile.backend does not exist."
            exit 1
          }

      - name: Verify Liara CLI
        run: |
          liara --version

      - name: Deploy Backend to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail

          liara deploy \
            --app="horizon-backend" \
            --api-token="$LIARA_API_TOKEN" \
            --no-app-logs \
            --dockerfile="Dockerfile.backend" \
            --platform=docker

      - name: Backend Deployment Summary
        if: success()
        run: |
          echo "## horizon-backend" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Liara deployment command completed successfully." >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # 4. FINAL SUMMARY
  # =========================================================
  final-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy-switch
      - deploy-backend
    if: always()

    steps:
      - name: Final Status
        run: |
          {
            echo "## 🚀 Horizon Core · Liara Deployment"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| horizon-switch | ${{ needs.deploy-switch.result }} |"
            echo "| horizon-backend | ${{ needs.deploy-backend.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Validation failed."
            exit 1
          fi

          if [[ "${{ needs.deploy-switch.result }}" != "success" ]]; then
            echo "horizon-switch deployment failed."
            exit 1
          fi

          if [[ "${{ needs.deploy-backend.result }}" != "success" ]]; then
            echo "horizon-backend deployment failed."
            exit 1
          fi

          echo "All Horizon Core deployments completed successfully."
