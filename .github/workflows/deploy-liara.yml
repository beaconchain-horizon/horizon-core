name: Deploy to Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Liara CLI
        run: npm install -g @liara/cli

      - name: Deploy Switch
        run: |
          liara deploy --app="horizon-switch" \
            --api-token="${{ secrets.LIARA_API_TOKEN }}" \
            --no-app-logs \
            --dockerfile="Dockerfile" \
            --platform=docker
        continue-on-error: true

      - name: Deploy Backend
        run: |
          liara deploy --app="horizon-backend" \
            --api-token="${{ secrets.LIARA_API_TOKEN }}" \
            --no-app-logs \
            --dockerfile="Dockerfile.backend" \
            --platform=docker
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- horizon-switch: done" >> $GITHUB_STEP_SUMMARY
          echo "- horizon-backend: done" >> $GITHUB_STEP_SUMMARY
