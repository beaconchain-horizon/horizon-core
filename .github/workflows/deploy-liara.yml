name: Deploy to Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install Liara CLI
        run: npm install -g @liara/cli
      
      - name: Debug token
        run: |
          if [ -z "${{ secrets.LIARA_API_TOKEN }}" ]; then
            echo "❌ TOKEN IS EMPTY"
            exit 1
          else
            echo "✅ Token exists (length: ${#LIARA_TOKEN})"
          fi
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
      
      - name: Deploy Switch
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy \
            --app="horizon-switch" \
            --api-token="$LIARA_TOKEN" \
            --platform=docker \
            --port=8080 \
            --path=. \
            --no-app-logs \
            --debug

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-switch
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install Liara CLI
        run: npm install -g @liara/cli
      
      - name: Deploy Frontend
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy \
            --app="horizon-frontend" \
            --api-token="$LIARA_TOKEN" \
            --platform=static \
            --path=./frontend \
            --no-app-logs
