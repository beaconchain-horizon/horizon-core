name: Horizon Core - Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go Vulnerability Scan (Go 1.24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go 1.24
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go version
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION | cut -d. -f1-2)" = "go1.24"
          test "$(go env GOTOOLCHAIN)" = "local"
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          govulncheck ./... 2>&1 | tee govulncheck-report.txt
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: govulncheck-report.txt
          if-no-files-found: ignore
          retention-days: 14

  gosec:
    name: Gosec Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Gosec
        uses: securego/gosec@v2.29.0
        with:
          args: "-fmt sarif -out results.sarif ./..."
      - name: Upload Gosec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gosec
        # Report artifact remains available even when Code Scanning is disabled.
        # Findings from the Gosec step above remain fatal.
        continue-on-error: true
