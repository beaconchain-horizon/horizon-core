name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go vulnerability scan (Go 1.24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (findings fail this job)
        shell: bash
        run: |
          set +e
          govulncheck ./... 2>&1 | tee govulncheck-report.txt
          result=${PIPESTATUS[0]}
          echo "govulncheck exit code: ${result}"
          exit "${result}"
      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck-report.txt
          if-no-files-found: ignore
      - name: Verify downloaded modules
        if: always()
        run: go mod verify

  gosec:
    name: Go security lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum
      - name: Run Gosec (findings fail this job)
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out results.sarif ./...'
      - name: Upload Gosec report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: results.sarif
          if-no-files-found: ignore
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        # The report artifact still remains available on repositories where
        # GitHub Code Scanning is not enabled; findings from Gosec remain fatal.
        continue-on-error: true
