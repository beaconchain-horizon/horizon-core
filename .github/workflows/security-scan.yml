name: Security Scan

on:
  push:
    branches: ["main", "feat/v14-unified-authority-license-*"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Report known Go vulnerabilities (strict; no suppressed exit code)
        run: govulncheck ./...
      - name: Verify module checksums
        run: go mod verify

  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Scan source (strict; findings fail this job)
        run: gosec -fmt sarif -out results.sarif ./...
      - name: Preserve SARIF report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif-report
          path: results.sarif
          if-no-files-found: ignore
