name: Horizon Core - CI and CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.24 - Test, Vet, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go 1.24
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Enforce Go 1.24
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION | cut -d. -f1-2)" = "go1.24"
          test "$(go env GOTOOLCHAIN)" = "local"
      - name: Download dependencies
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run go vet
        run: go vet ./...
      - name: Build Horizon Switch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o build/horizon-switch ./cmd/switch
          test -s build/horizon-switch

  codeql:
    name: CodeQL - Go
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go 1.24
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      - name: Build project for analysis
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go mod download
          go build ./...
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
