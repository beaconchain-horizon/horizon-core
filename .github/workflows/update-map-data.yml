cd ~/Beaconchain/horizon-core
cat > .github/workflows/update-map-data.yml <<'YAML'
name: Update weekly map data

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate map data
        run: |
          mkdir -p docs/data
          printf '{"generated_at":"%s","source":"manual","version":"1.0"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/data/map-data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/map-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update map data"
            git push
          fi
YAML
