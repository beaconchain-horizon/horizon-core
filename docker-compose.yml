services:
  postgres:
    image: postgres:16-alpine
    container_name: horizon-postgres
    restart: always
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: horizon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 10s
      timeout: 5s
      retries: 5

  switch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horizon-switch
    restart: always
    environment:
      GIN_MODE: release
      SWITCH_PORT: 8080
      SWITCH_DB: /data/horizon-switch.db
      CHAIN_CONFIG: /data/chain.json
      CUSTOMERS_CONFIG: /data/customers.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
    volumes:
      - switch_data:/data
      - ./config:/app/config-seed:ro
    ports:
      - "8080:8080"
    networks:
      - horizon-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: horizon-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: postgresql://horizon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/horizon
    ports:
      - "8081:8080"
    networks:
      - horizon-net

volumes:
  postgres_data:
  switch_data:

networks:
  horizon-net:
    driver: bridge
