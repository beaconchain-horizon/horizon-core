version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: horizon_switch
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - horizon_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: horizon_switch
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - horizon_net

  switch:
    build: .
    command: ["./switch"]
    environment:
      - DB_ENGINE=postgres
      - DB_DSN=host=postgres port=5432 user=postgres password=postgres dbname=horizon_switch sslmode=disable
      - SWITCH_PORT=8091
    ports:
      - "8091:8091"
    depends_on:
      - postgres
    networks:
      - horizon_net

  angel-merkle:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Merkle, NODE_PORT=9001]
    networks: [horizon_net]

  angel-hash:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Hash, NODE_PORT=9002]
    networks: [horizon_net]

  angel-ecdsa:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=ECDSA, NODE_PORT=9003]
    networks: [horizon_net]

  angel-type:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Type, NODE_PORT=9004]
    networks: [horizon_net]

  angel-volume:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Volume, NODE_PORT=9005]
    networks: [horizon_net]

  angel-time:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Time, NODE_PORT=9006]
    networks: [horizon_net]

  angel-user:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=User, NODE_PORT=9007]
    networks: [horizon_net]

  agent-guardian:
    build: .
    command: ["./angel"]
    environment: [NODE_ROLE=Guardian, NODE_PORT=9008]
    networks: [horizon_net]

  backend:
    build: .
    command: ["./backend"]
    environment: [PORT=8080]
    ports: ["8080:8080"]
    networks: [horizon_net]

  brain:
    build: .
    command: ["./brain"]
    environment: [BRAIN_PORT=9300]
    ports: ["9300:9300"]
    networks: [horizon_net]

networks:
  horizon_net:
    driver: bridge

volumes:
  pgdata:
  mysqldata:
