<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت Horizon</title>
    <style>
        body { background: #060b18; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; }
        button { background: #4f9eff; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #1e293b; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <h2>پنل مدیریت Horizon</h2>

    <div class="card">
        <h3>ثبت مشتری جدید</h3>
        <input id="custName" placeholder="نام کامل">
        <input id="custEmail" placeholder="ایمیل">
        <input id="custWallet" placeholder="آدرس ولت">
        <button onclick="createCustomer()">ثبت مشتری</button>
    </div>

    <div class="card">
        <h3>لیست مشتریان</h3>
        <button onclick="loadCustomers()">بارگذاری مشتریان</button>
        <table><thead><tr><th>ID</th><th>نام</th><th>ایمیل</th></tr></thead><tbody id="custTable"></tbody></table>
    </div>

    <div class="card">
        <h3>ثبت پرداخت جدید</h3>
        <input id="payCustId" type="number" placeholder="شناسه مشتری">
        <input id="payAmount" type="number" placeholder="مبلغ">
        <input id="payCurrency" placeholder="واحد (ETH/USD)">
        <button onclick="createPayment()">ثبت پرداخت</button>
    </div>

    <div class="card">
        <h3>لیست پرداخت‌ها</h3>
        <button onclick="loadPayments()">بارگذاری پرداخت‌ها</button>
        <table><thead><tr><th>ID</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody id="payTable"></tbody></table>
    </div>

<script>
const API='https://horizon-backend.liara.run';

async function createCustomer(){
    const b={full_name:document.getElementById('custName').value,email:document.getElementById('custEmail').value,wallet:document.getElementById('custWallet').value};
    await fetch(API+'/api/v1/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    loadCustomers();
}
async function loadCustomers(){
    const r=await fetch(API+'/api/v1/customers'); const d=await r.json(); let h='';
    d.forEach(c=>{h+='<tr><td>'+c.id+'</td><td>'+c.full_name+'</td><td>'+c.email+'</td></tr>'});
    document.getElementById('custTable').innerHTML=h;
}
async function createPayment(){
    const b={customer_id:parseInt(document.getElementById('payCustId').value),amount:parseFloat(document.getElementById('payAmount').value),currency:document.getElementById('payCurrency').value,status:'pending'};
    await fetch(API+'/api/v1/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    loadPayments();
}
async function loadPayments(){
    const r=await fetch(API+'/api/v1/payments'); const d=await r.json(); let h='';
    d.forEach(p=>{h+='<tr><td>'+p.id+'</td><td>'+p.customer_id+'</td><td>'+p.amount+' '+p.currency+'</td><td>'+p.status+'</td></tr>'});
    document.getElementById('payTable').innerHTML=h;
}
loadCustomers(); loadPayments();
</script>
</body>
</html>
