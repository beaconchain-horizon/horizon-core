<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(12,18,34,0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79,158,255,0.12);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width:768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card {
            background: rgba(20,26,44,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .card h3 {
            font-size: 0.9rem;
            color: #4f9eff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.3rem 0;
        }
        .btn:hover { background: #3a7bd5; transform: scale(1.02); }
        .btn.danger { background: #f87171; }
        .btn.danger:hover { background: #ef4444; }
        .btn.success { background: #4ade80; }
        .btn.success:hover { background: #22c55e; }
        .btn.gold { background: #facc15; }
        .btn.gold:hover { background: #eab308; }
        .btn.outline { background: transparent; border: 1px solid #4f9eff55; color: #4f9eff; }
        .btn.outline:hover { background: rgba(79,158,255,0.1); }
        .footer { text-align: center; font-size: 0.65rem; color: #475569; border-top: 1px solid #1a2240; padding-top: 1rem; margin-top: 1.5rem; }
        .badge-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .badge {
            background: rgba(79,158,255,0.1);
            border: 1px solid #4f9eff33;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.6rem;
            color: #9bb2ff;
        }
        .badge.green { background: rgba(74,222,128,0.12); border-color: #4ade8044; color: #4ade80; }
        .badge.red { background: rgba(248,113,113,0.12); border-color: #f8717144; color: #f87171; }
        .badge.gold { background: rgba(251,191,36,0.12); border-color: #facc1544; color: #facc15; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><i class="fas fa-user-cog" style="color:#4f9eff;"></i> Horizon Admin Panel</h1>
    </div>
    <div class="badge-group">
        <span class="badge green"><i class="fas fa-circle"></i> Backend: <span id="backendStatus">Checking...</span></span>
        <span class="badge gold"><i class="fas fa-key"></i> License: <span id="licenseStatus">⏳</span></span>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3><i class="fas fa-file-signature"></i> License Management</h3>
            <button class="btn gold" id="genBtn"><i class="fas fa-key"></i> Generate License</button>
            <button class="btn outline" id="refreshBtn"><i class="fas fa-sync"></i> Refresh List</button>
            <button class="btn danger" id="suspendBtn"><i class="fas fa-ban"></i> Suspend All</button>
            <button class="btn success" id="renewBtn"><i class="fas fa-sync"></i> Renew All</button>
            <div id="adminOutput" class="output-box" style="margin-top:1rem;background:#0f172a;padding:0.5rem;border-radius:0.8rem;font-size:0.7rem;color:#4ade80;display:none;"></div>
        </div>
        <div class="card">
            <h3><i class="fas fa-server"></i> System Status</h3>
            <p style="font-size:0.7rem;color:#8fa2dc;"><i class="fas fa-database"></i> Database: <span id="dbStatus">⏳</span></p>
            <p style="font-size:0.7rem;color:#8fa2dc;"><i class="fas fa-link"></i> Switch: <span id="switchStatus">⏳</span></p>
            <p style="font-size:0.7rem;color:#8fa2dc;"><i class="fas fa-robot"></i> AI: <span id="aiStatus">⏳</span></p>
            <button class="btn outline" id="checkAllBtn"><i class="fas fa-heartbeat"></i> Check All</button>
        </div>
    </div>
    <div class="footer">Horizon Admin · Connected to Real Backend</div>
</div>

<script>
const API_BASE = 'https://horizon-backend.liara.run';

// Check backend status
async function checkBackend() {
    try {
        const resp = await fetch(`${API_BASE}/api/v1/health`, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            document.getElementById('backendStatus').textContent = 'Online';
            document.getElementById('backendStatus').parentElement.className = 'badge green';
        } else {
            document.getElementById('backendStatus').textContent = 'Offline';
            document.getElementById('backendStatus').parentElement.className = 'badge red';
        }
    } catch (e) {
        document.getElementById('backendStatus').textContent = 'Offline';
        document.getElementById('backendStatus').parentElement.className = 'badge red';
    }
}

// Generate License
document.getElementById('genBtn').addEventListener('click', async () => {
    const out = document.getElementById('adminOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Generating...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: 'horizon-core', user_id: 'admin', volume: 100, duration: 8760 })
        });
        const data = await resp.json();
        if (resp.ok) {
            out.textContent = '✅ License generated: ' + JSON.stringify(data, null, 2);
        } else {
            out.textContent = '❌ Error: ' + (data.error || JSON.stringify(data));
        }
    } catch (e) {
        out.textContent = '❌ Connection error: ' + e.message;
    }
});

// Refresh
document.getElementById('refreshBtn').addEventListener('click', async () => {
    const out = document.getElementById('adminOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Refreshing...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/licenses`);
        if (resp.ok) {
            const data = await resp.json();
            out.textContent = '✅ Licenses: ' + JSON.stringify(data, null, 2);
        } else {
            out.textContent = '❌ Failed to fetch licenses.';
        }
    } catch (e) {
        out.textContent = '❌ Connection error: ' + e.message;
    }
});

// Suspend All
document.getElementById('suspendBtn').addEventListener('click', async () => {
    if (!confirm('Suspend all active licenses?')) return;
    const out = document.getElementById('adminOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Suspending...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/suspend-all`, { method: 'POST' });
        const data = await resp.json();
        out.textContent = '✅ ' + (data.message || 'All licenses suspended.');
    } catch (e) {
        out.textContent = '❌ Connection error: ' + e.message;
    }
});

// Renew All
document.getElementById('renewBtn').addEventListener('click', async () => {
    if (!confirm('Renew all licenses for 1 year?')) return;
    const out = document.getElementById('adminOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Renewing...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/renew-all`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ duration: 8760 })
        });
        const data = await resp.json();
        out.textContent = '✅ ' + (data.message || 'All licenses renewed.');
    } catch (e) {
        out.textContent = '❌ Connection error: ' + e.message;
    }
});

// Check All Status
document.getElementById('checkAllBtn').addEventListener('click', async () => {
    const db = document.getElementById('dbStatus');
    const sw = document.getElementById('switchStatus');
    const ai = document.getElementById('aiStatus');
    db.textContent = '⏳';
    sw.textContent = '⏳';
    ai.textContent = '⏳';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/health`, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            db.textContent = '✅ Online';
            sw.textContent = '✅ Online';
            ai.textContent = '✅ Online';
        } else {
            db.textContent = '❌ Offline';
            sw.textContent = '❌ Offline';
            ai.textContent = '❌ Offline';
        }
    } catch (e) {
        db.textContent = '❌ Offline';
        sw.textContent = '❌ Offline';
        ai.textContent = '❌ Offline';
    }
});

window.onload = function() {
    checkBackend();
    setInterval(checkBackend, 30000);
};
</script>
</body>
</html>
