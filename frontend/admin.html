<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین Horizon</title>
<style>
body { background: #060b18; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; }
.card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
button { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #334155; background: #4f9eff; color: #000; font-weight: bold; cursor: pointer; }
.btn-red { background: #f87171; }
a { color: #fff; text-decoration: none; display: inline-block; margin: 5px; padding: 10px; background: #1e293b; border-radius: 8px; }
</style>
</head>
<body>
<h2>پنل ادمین Horizon</h2>
<div class="card">
<a href="license.html">پنل لایسنس</a>
<a href="bank.html">پنل بانک</a>
<a href="industry.html">پنل صنعت</a>
</div>
<div class="card">
<button onclick="init()">استارت سیستم</button>
<button class="btn-red" onclick="shutdown()">خاموشی سیستم</button>
</div>
<script>
const API='https://horizon-backend.liara.run';
async function init(){await fetch(API+'/api/v1/admin/init',{method:'POST',headers:{'X-Admin-Key':'test-admin-token'}});alert('سیستم استارت خورد');}
async function shutdown(){await fetch(API+'/api/v1/admin/shutdown',{method:'POST',headers:{'X-Admin-Key':'test-admin-token'}});alert('سیستم خاموش شد');}
</script>
</body>
</html>
