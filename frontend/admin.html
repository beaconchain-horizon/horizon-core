<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت Horizon</title>
    <style>
        body { background: #060b18; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; }
        button { background: #4f9eff; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #1e293b; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <h2>پنل مدیریت Horizon</h2>

    <div class="card">
        <h3>تولید لایسنس</h3>
        <input id="prodId" placeholder="Product ID" value="horizon-core">
        <input id="userId" placeholder="User ID" value="bank_melli">
        <input id="duration" type="number" placeholder="مدت (ساعت)" value="8760">
        <button onclick="generateLicense()">تولید لایسنس</button>
    </div>

    <div class="card">
        <h3>لیست لایسنس‌ها</h3>
        <button onclick="loadLicenses()">بارگذاری</button>
        <table><thead><tr><th>ID</th><th>کاربر</th><th>محصول</th><th>وضعیت</th></tr></thead><tbody id="licTable"></tbody></table>
    </div>

    <div class="card">
        <h3>لیست تراکنش‌ها</h3>
        <button onclick="loadTransactions()">بارگذاری</button>
        <table><thead><tr><th>ID</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody id="txTable"></tbody></table>
    </div>

<script>
const API='https://horizon-backend.liara.run';

async function generateLicense(){
    const b={product_id:document.getElementById('prodId').value,user_id:document.getElementById('userId').value,duration:parseInt(document.getElementById('duration').value),volume:100};
    await fetch(API+'/api/v1/license/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    loadLicenses();
}

async function loadLicenses(){
    const r=await fetch(API+'/api/v1/licenses'); const d=await r.json(); let h='';
    d.forEach(l=>{h+='<tr><td>'+l.id+'</td><td>'+l.user_id+'</td><td>'+l.product_id+'</td><td>'+l.status+'</td></tr>'});
    document.getElementById('licTable').innerHTML=h;
}

async function loadTransactions(){
    const r=await fetch(API+'/api/v1/transactions'); const d=await r.json(); let h='';
    d.forEach(t=>{h+='<tr><td>'+t.id+'</td><td>'+t.amount+'</td><td>'+t.status+'</td></tr>'});
    document.getElementById('txTable').innerHTML=h;
}

loadLicenses(); loadTransactions();
</script>
</body>
</html>
