<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید | Horizon Angel</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">
    <header class="bg-gray-800 shadow-lg border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-angel text-yellow-400 text-3xl"></i>
                <span class="text-2xl font-bold text-blue-400">Horizon<span class="text-yellow-400">Angel</span></span>
            </div>
            <nav class="hidden md:flex gap-6 text-sm">
                <a href="index.html" class="hover:text-yellow-400">خانه</a>
                <a href="products.html" class="hover:text-yellow-400">محصولات</a>
                <a href="dashboard.html" class="hover:text-yellow-400">پنل کاربری</a>
                <a href="admin.html" class="hover:text-yellow-400">مدیریت</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="relative">
                    <i class="fas fa-shopping-cart text-xl text-yellow-400"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold rounded-full px-2 py-0.5">0</span>
                </a>
                <a href="login.html" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">ورود</a>
            </div>
        </div>
    </header>
    <section class="container mx-auto px-4 py-16">
        <h1 class="text-3xl font-bold mb-8">سبد خرید</h1>
        <div id="cart-items" class="bg-gray-800 p-6 rounded-xl border border-gray-700"></div>
        <div class="mt-6 flex justify-between items-center">
            <span class="text-xl font-bold">جمع کل: <span id="cart-total" class="text-yellow-400">۰</span></span>
            <a href="checkout.html" class="bg-yellow-400 text-black px-6 py-3 rounded-lg font-bold hover:bg-yellow-300">پرداخت</a>
        </div>
    </section>
    <footer class="bg-gray-800 py-6 text-center text-gray-400 border-t border-gray-700">
        <p>© 2025 Horizon Angel. تمامی حقوق محفوظ است.</p>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
            updateCartBadge();
        });
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400">سبد خرید شما خالی است.</p>';
                totalSpan.textContent = '۰';
                return;
            }
            let total = 0;
            container.innerHTML = cart.map(item => {
                const price = 250000;
                total += price * item.quantity;
                return `
                    <div class="flex justify-between items-center border-b border-gray-700 py-4">
                        <div>
                            <span class="font-bold">محصول: ${item.id}</span>
                            <span class="text-gray-400 mr-4">تعداد: ${item.quantity}</span>
                            <span class="text-yellow-400 mr-4">${(price * item.quantity).toLocaleString()} تومان</span>
                        </div>
                        <button onclick="removeFromCart('${item.id}'); renderCart();" class="text-red-400 hover:text-red-300">حذف</button>
                    </div>
                `;
            }).join('');
            totalSpan.textContent = total.toLocaleString() + ' تومان';
        }
    </script>
<script src="offline-storage.js"></script>
</body>
</html>
