<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central Bank Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(12,18,34,0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79,158,255,0.12);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card {
            background: rgba(20,26,44,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 1.5rem;
        }
        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:hover { background: #3a7bd5; transform: scale(1.02); }
        .btn.gold { background: #facc15; }
        .btn.gold:hover { background: #eab308; }
        .btn.success { background: #4ade80; }
        .btn.success:hover { background: #22c55e; }
        .footer { text-align: center; font-size: 0.65rem; color: #475569; border-top: 1px solid #1a2240; padding-top: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><i class="fas fa-landmark" style="color:#4f9eff;"></i> Central Bank Demo</h1>
    </div>
    <div class="card">
        <p style="color:#8fa2dc;">This is a demo page for the Central Bank dashboard.</p>
        <button class="btn gold" id="pingBtn"><i class="fas fa-heartbeat"></i> Ping Backend</button>
        <button class="btn success" id="licenseBtn"><i class="fas fa-key"></i> Check License</button>
        <div id="demoOutput" style="margin-top:1rem;background:#0f172a;padding:0.5rem;border-radius:0.8rem;font-size:0.7rem;color:#4ade80;display:none;"></div>
    </div>
    <div class="footer">Central Bank Demo</div>
</div>

<script>
const API_BASE = 'https://horizon-backend.liara.run';

document.getElementById('pingBtn').addEventListener('click', async () => {
    const out = document.getElementById('demoOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Pinging...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/health`, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            out.textContent = '✅ Backend is online!';
        } else {
            out.textContent = '❌ Backend responded with status: ' + resp.status;
        }
    } catch (e) {
        out.textContent = '❌ Cannot connect to backend.';
    }
});

document.getElementById('licenseBtn').addEventListener('click', async () => {
    const out = document.getElementById('demoOutput');
    out.style.display = 'block';
    out.textContent = '⏳ Checking license...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ license: 'demo-license' })
        });
        const data = await resp.json();
        out.textContent = '✅ License check result: ' + JSON.stringify(data);
    } catch (e) {
        out.textContent = '❌ Connection error.';
    }
});
</script>
</body>
</html>
