<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل لایسنس Horizon</title>
    <style>
        body { background: #060b18; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; }
        button { background: #4f9eff; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #1e293b; padding: 8px; text-align: center; }
        .output { background: #020617; padding: 10px; border-radius: 8px; color: #4ade80; font-family: monospace; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
<h2>پنل لایسنس Horizon</h2>
<div class="card">
<h3>تولید لایسنس جدید</h3>
<input id="productId" placeholder="Product ID" value="horizon-core">
<input id="userId" placeholder="User ID" value="bank_melli">
<input id="duration" type="number" placeholder="مدت (ساعت)" value="8760">
<button onclick="generate()">تولید لایسنس</button>
<div class="output" id="output">خروجی لایسنس اینجا نمایش داده می‌شود...</div>
</div>
<div class="card">
<h3>لیست لایسنس‌ها</h3>
<button onclick="loadList()">بارگذاری لیست</button>
<table><thead><tr><th>ID</th><th>کاربر</th><th>محصول</th><th>وضعیت</th></tr></thead><tbody id="tbl"></tbody></table>
</div>
<script>
const API='https://horizon-backend.liara.run';
async function generate(){
const b={product_id:document.getElementById('productId').value,user_id:document.getElementById('userId').value,duration:parseInt(document.getElementById('duration').value)};
document.getElementById('output').innerText='در حال تولید لایسنس...';
try{
const r=await fetch(API+'/api/v1/license/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const d=await r.json();
document.getElementById('output').innerText=JSON.stringify(d,null,2);
loadList();
}catch(e){document.getElementById('output').innerText='خطا: '+e.message;}
}
async function loadList(){
try{
const r=await fetch(API+'/api/v1/licenses',{headers:{'X-Admin-Key':'test-admin-token'}});
const d=await r.json();let h='';
d.forEach(l=>{h+='<tr><td>'+l.id+'</td><td>'+l.user_id+'</td><td>'+l.product_id+'</td><td>'+l.status+'</td></tr>'});
document.getElementById('tbl').innerHTML=h;
}catch(e){document.getElementById('tbl').innerHTML='<tr><td colspan="4">'+e.message+'</td></tr>';}
}
loadList();
</script>
</body>
</html>
