<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon License Manager · پنل مدیریت</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgPulse 15s infinite alternate;
        }
        @keyframes bgPulse {
            0% { background: #060b18; }
            50% { background: #0a1628; }
            100% { background: #060b18; }
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(12, 18, 34, 0.75);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79, 158, 255, 0.15);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: containerFade 1.2s ease-out;
        }
        @keyframes containerFade {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(79, 158, 255, 0.15);
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4f9eff, #c084fc, transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span {
            font-size: 0.75rem;
            color: #8fa2dc;
            display: block;
        }
        .badge-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(79, 158, 255, 0.1);
            border: 1px solid #4f9eff33;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.65rem;
            color: #9bb2ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s;
        }
        .badge.green { background: rgba(74, 222, 128, 0.12); border-color: #4ade8044; color: #4ade80; }
        .badge.red { background: rgba(248, 113, 113, 0.12); border-color: #f8717144; color: #f87171; }
        .badge.gold { background: rgba(251, 191, 36, 0.12); border-color: #facc1544; color: #facc15; }
        .badge.blue { background: rgba(79, 158, 255, 0.15); border-color: #4f9eff66; color: #4f9eff; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width: 1200px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

        .card {
            background: rgba(20, 26, 44, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(79, 158, 255, 0.03), transparent 70%);
            animation: cardShine 8s linear infinite;
            pointer-events: none;
        }
        @keyframes cardShine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #4f9eff55;
            box-shadow: 0 12px 40px rgba(79, 158, 255, 0.15);
        }
        .card h3 {
            font-size: 0.9rem;
            color: #4f9eff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }
        .card h3 .badge-sm {
            font-size: 0.6rem;
            background: rgba(79, 158, 255, 0.15);
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            color: #4f9eff;
            margin-right: auto;
        }

        .license-list {
            max-height: 300px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }
        .license-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.7rem;
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.3rem;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid #4f9eff;
            transition: all 0.3s;
        }
        .license-item .status { font-size: 0.6rem; padding: 0.15rem 0.6rem; border-radius: 40px; }
        .license-item .status.active { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .license-item .status.expired { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .license-item .status.suspended { background: rgba(251, 191, 36, 0.15); color: #facc15; }
        .license-item .license-id { color: #4f9eff; font-family: monospace; font-size: 0.6rem; }

        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 12px rgba(79, 158, 255, 0.3);
        }
        .btn:hover {
            background: #3a7bd5;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 158, 255, 0.5);
        }
        .btn:active { transform: scale(0.95); }
        .btn.outline {
            background: transparent;
            border: 1px solid #4f9eff55;
            color: #4f9eff;
            box-shadow: none;
        }
        .btn.outline:hover { background: rgba(79, 158, 255, 0.15); }
        .btn.danger { background: #f87171; color: #0a0f1e; box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3); }
        .btn.danger:hover { background: #ef4444; }
        .btn.success { background: #4ade80; color: #0a0f1e; box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3); }
        .btn.success:hover { background: #22c55e; }
        .btn.gold { background: #facc15; color: #0a0f1e; box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3); }
        .btn.gold:hover { background: #eab308; }

        .form-group {
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
        }
        .form-group label {
            font-size: 0.7rem;
            color: #8fa2dc;
            display: block;
            margin-bottom: 0.2rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #1a2240;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            color: white;
            font-size: 0.8rem;
            font-family: monospace;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #4f9eff; }

        .output-box {
            background: #0f172a;
            border-radius: 0.8rem;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.7rem;
            color: #4ade80;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.65rem;
            color: #475569;
            border-top: 1px solid #1a2240;
            padding-top: 1rem;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f9eff; border-radius: 4px; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 26, 44, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #4f9eff55;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            color: #eef2ff;
            font-size: 0.85rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 999;
            max-width: 400px;
            animation: slideUp 0.4s ease-out;
            display: none;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .toast.success { border-color: #4ade80; }
        .toast.error { border-color: #f87171; }
        .toast.warning { border-color: #facc15; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-key" style="color:#4f9eff;"></i> Horizon License Manager</h1>
            <span>پنل مدیریت لایسنس · تولید، تأیید و نظارت</span>
        </div>
        <div class="badge-group">
            <span class="badge green"><i class="fas fa-circle"></i> وضعیت: <span id="statusText">بررسی...</span></span>
            <span class="badge blue"><i class="fas fa-tags"></i> لایسنس فعال: <span id="activeCount">۰</span></span>
            <span class="badge red"><i class="fas fa-hourglass-end"></i> منقضی: <span id="expiredCount">۰</span></span>
            <span class="badge gold"><i class="fas fa-clock"></i> سرور: <span id="serverUrl">در حال اتصال...</span></span>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3><i class="fas fa-plus-circle"></i> تولید لایسنس جدید</h3>
            <div class="form-group">
                <label>شناسه محصول (Product ID)</label>
                <input type="text" id="productId" value="horizon-core" placeholder="horizon-core">
            </div>
            <div class="form-group">
                <label>شناسه کاربر (User ID / بانک)</label>
                <input type="text" id="userId" placeholder="bank_melli" value="bank_melli">
            </div>
            <div class="form-group">
                <label>مدت اعتبار (ساعت)</label>
                <input type="number" id="duration" value="8760" placeholder="8760 = 1 سال">
            </div>
            <button class="btn gold" id="generateBtn"><i class="fas fa-key"></i> تولید لایسنس</button>
            <div id="generatedLicense" class="output-box" style="display:none;"></div>
        </div>

        <div class="card">
            <h3><i class="fas fa-check-circle"></i> تأیید لایسنس</h3>
            <div class="form-group">
                <label>لایسنس (License String)</label>
                <input type="text" id="verifyLicense" placeholder="لایسنس تولیدشده را وارد کنید">
            </div>
            <button class="btn success" id="verifyBtn"><i class="fas fa-shield-alt"></i> تأیید</button>
            <div id="verifyResult" class="output-box" style="display:none;"></div>
        </div>
    </div>

    <div class="grid-3">
        <div class="card">
            <h3><i class="fas fa-list"></i> لایسنس‌های فعال</h3>
            <div class="license-list" id="activeLicenses">
                <div style="color:#8fa2dc;font-size:0.7rem;">در حال بارگذاری...</div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-history"></i> لاگ تأییدها</h3>
            <div class="license-list" id="logList">
                <div style="color:#8fa2dc;font-size:0.7rem;">در حال بارگذاری...</div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-cogs"></i> کنترل</h3>
            <div style="display:flex;flex-direction:column;gap:0.5rem;position:relative;z-index:1;">
                <button class="btn danger" id="suspendAllBtn"><i class="fas fa-ban"></i> تعلیق همه لایسنس‌ها</button>
                <button class="btn success" id="renewAllBtn"><i class="fas fa-sync"></i> تمدید همه (۱ سال)</button>
                <button class="btn outline" id="refreshBtn"><i class="fas fa-sync"></i> به‌روزرسانی لیست</button>
                <button class="btn outline" id="exportBtn"><i class="fas fa-file-export"></i> خروجی گزارش</button>
                <button class="btn outline" id="checkServerBtn"><i class="fas fa-heartbeat"></i> بررسی وضعیت سرور</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <span style="color:#4f9eff;">Horizon License Server</span> · مدیریت غیرمتمرکز لایسنس‌ها · ۲۰۲۶
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script>
    // ==========================================================
    // ۱. تنظیمات اولیه
    // ==========================================================
    // ⚠️ آدرس License Server واقعی خود را اینجا وارد کنید
    const LICENSE_SERVER_URL = 'https://your-license-server.com';

    // ==========================================================
    // ۲. توابع کمکی (Toast، نمایش پیام، ...)
    // ==========================================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.style.display = 'block';
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function updateServerStatus(online) {
        const statusText = document.getElementById('statusText');
        const serverUrl = document.getElementById('serverUrl');
        if (online) {
            statusText.textContent = 'آنلاین';
            statusText.parentElement.className = 'badge green';
            serverUrl.textContent = LICENSE_SERVER_URL;
        } else {
            statusText.textContent = 'آفلاین';
            statusText.parentElement.className = 'badge red';
            serverUrl.textContent = '❌ سرور در دسترس نیست';
        }
    }

    // ==========================================================
    // ۳. بررسی وضعیت سرور
    // ==========================================================
    async function checkServerStatus() {
        try {
            const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/status`, {
                method: 'HEAD',
                signal: AbortSignal.timeout(5000)
            });
            if (response.ok) {
                updateServerStatus(true);
                showToast('✅ سرور License Server آنلاین است.', 'success');
                await loadLicenses();
                return true;
            } else {
                throw new Error('پاسخ نامعتبر');
            }
        } catch (error) {
            updateServerStatus(false);
            showToast('⚠️ سرور License Server در دسترس نیست.', 'error');
            // بارگذاری داده‌های Mock برای نمایش (فقط در صورت قطعی سرور)
            loadMockData();
            return false;
        }
    }

    // ==========================================================
    // ۴. دریافت لیست لایسنس‌ها از سرور
    // ==========================================================
    async function loadLicenses() {
        try {
            const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/status`);
            if (!response.ok) throw new Error('خطا در دریافت لیست لایسنس‌ها');
            const data = await response.json();
            renderLicenses(data);
            return data;
        } catch (error) {
            console.warn('⚠️ خطا در دریافت لایسنس‌ها:', error);
            loadMockData();
            return null;
        }
    }

    function renderLicenses(data) {
        // انتظار داریم داده به این شکل باشد: { licenses: [...], logs: [...] }
        const licenses = data.licenses || data || [];
        const logs = data.logs || [];

        // به‌روزرسانی شمارنده‌ها
        const active = licenses.filter(l => l.status === 'active' || l.status === 'valid');
        const expired = licenses.filter(l => l.status === 'expired' || l.status === 'invalid' || l.status === 'suspended');
        document.getElementById('activeCount').textContent = active.length;
        document.getElementById('expiredCount').textContent = expired.length;

        // لیست لایسنس‌ها
        const container = document.getElementById('activeLicenses');
        if (licenses.length === 0) {
            container.innerHTML = '<div style="color:#8fa2dc;font-size:0.7rem;">هیچ لایسنس فعالی یافت نشد.</div>';
        } else {
            container.innerHTML = licenses.map(l => `
                <div class="license-item">
                    <div>
                        <div class="license-id">${l.id || l.license_id || 'N/A'}</div>
                        <div style="font-size:0.55rem;color:#8fa2dc;">${l.userId || l.user_id || 'نامشخص'} · ${l.productId || l.product_id || 'نامشخص'}</div>
                    </div>
                    <div style="text-align:left;">
                        <span style="font-size:0.55rem;color:#8fa2dc;">${l.expiry || l.expires_at || 'نامشخص'}</span>
                        <span class="status ${l.status === 'active' || l.status === 'valid' ? 'active' : l.status === 'expired' || l.status === 'invalid' ? 'expired' : 'suspended'}">
                            ${l.status === 'active' || l.status === 'valid' ? '🟢 فعال' : l.status === 'expired' || l.status === 'invalid' ? '🔴 منقضی' : '🟡 تعلیق'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // لاگ‌ها
        const logContainer = document.getElementById('logList');
        if (!logs || logs.length === 0) {
            logContainer.innerHTML = '<div style="color:#8fa2dc;font-size:0.7rem;">هیچ لاگی ثبت نشده است.</div>';
        } else {
            logContainer.innerHTML = logs.slice(0, 10).map(log => `
                <div class="license-item" style="border-right-color:#c084fc;">
                    <div>
                        <div style="font-size:0.55rem;color:#8fa2dc;">${log.time || log.timestamp || 'نامشخص'}</div>
                        <div style="font-size:0.6rem;">${log.action || log.message || 'عملیات'}</div>
                    </div>
                    <div style="font-size:0.6rem;color:${(log.result || '').includes('✅') || log.status === 'success' ? '#4ade80' : '#f87171'};">
                        ${log.result || log.status || '—'}
                    </div>
                </div>
            `).join('');
        }

        updateServerStatus(true);
    }

    // ==========================================================
    // ۵. داده‌های Mock (پشتیبان برای زمان قطعی سرور)
    // ==========================================================
    function loadMockData() {
        const mockLicenses = [
            { id: 'LIC-1001', productId: 'horizon-core', userId: 'bank_melli', duration: 8760, status: 'active', expiry: '2027-01-01' },
            { id: 'LIC-1002', productId: 'horizon-core', userId: 'bank_maskan', duration: 4320, status: 'active', expiry: '2026-06-01' },
            { id: 'LIC-1003', productId: 'horizon-toolbox', userId: 'bank_shahr', duration: 8760, status: 'expired', expiry: '2025-01-01' }
        ];
        const mockLogs = [
            { time: '۱۴۰۳-۰۵-۱۰ ۱۴:۳۰', action: 'تأیید لایسنس LIC-1001 از بانک ملی', result: '✅ معتبر' },
            { time: '۱۴۰۳-۰۵-۱۰ ۱۴:۳۲', action: 'تأیید لایسنس LIC-1002 از بانک مسکن', result: '✅ معتبر' },
            { time: '۱۴۰۳-۰۵-۱۰ ۱۴:۳۵', action: 'تأیید لایسنس LIC-1003 از بانک شهر', result: '❌ منقضی' }
        ];
        renderLicenses({ licenses: mockLicenses, logs: mockLogs });
        showToast('ℹ️ داده‌های نمایشی (Mock) به دلیل عدم اتصال به سرور بارگذاری شدند.', 'warning');
    }

    // ==========================================================
    // ۶. تولید لایسنس (ارسال به سرور)
    // ==========================================================
    async function generateLicenseOnServer(productId, userId, duration) {
        try {
            const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, user_id: userId, duration: duration })
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || 'خطا در تولید لایسنس');
            }
            const result = await response.json();
            return result;
        } catch (error) {
            console.error('❌ خطا در تولید لایسنس:', error);
            throw error;
        }
    }

    // ==========================================================
    // ۷. تأیید لایسنس (ارسال به سرور)
    // ==========================================================
    async function verifyLicenseOnServer(licenseString) {
        try {
            const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ license: licenseString })
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || 'خطا در تأیید لایسنس');
            }
            const result = await response.json();
            return result;
        } catch (error) {
            console.error('❌ خطا در تأیید لایسنس:', error);
            throw error;
        }
    }

    // ==========================================================
    // ۸. اتصال دکمه‌ها
    // ==========================================================
    document.addEventListener('DOMContentLoaded', async () => {
        // بررسی اولیه سرور
        await checkServerStatus();

        // دکمه تولید لایسنس
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const productId = document.getElementById('productId').value.trim();
            const userId = document.getElementById('userId').value.trim();
            const duration = parseInt(document.getElementById('duration').value) || 8760;

            if (!productId || !userId) {
                showToast('لطفاً Product ID و User ID را وارد کنید.', 'error');
                return;
            }

            const output = document.getElementById('generatedLicense');
            output.style.display = 'block';
            output.innerHTML = '⏳ در حال تولید لایسنس...';

            try {
                const result = await generateLicenseOnServer(productId, userId, duration);
                output.innerHTML = `
                    ✅ لایسنس با موفقیت تولید شد<br>
                    <strong>ID:</strong> ${result.id || result.license_id || 'N/A'}<br>
                    <strong>کاربر:</strong> ${result.userId || result.user_id || userId}<br>
                    <strong>انقضا:</strong> ${result.expiry || result.expires_at || 'نامشخص'}<br>
                    <strong>امضا:</strong> ${(result.signature || '').slice(0, 20)}...<br>
                    <button class="btn outline" style="margin-top:0.5rem;" onclick="copyLicenseText('${result.id || result.license_id || ''}')">
                        <i class="fas fa-copy"></i> کپی
                    </button>
                `;
                showToast(`✅ لایسنس ${result.id || result.license_id} با موفقیت تولید شد.`, 'success');
                await loadLicenses(); // به‌روزرسانی لیست
            } catch (error) {
                output.innerHTML = `❌ خطا: ${error.message}`;
                showToast(`❌ خطا در تولید لایسنس: ${error.message}`, 'error');
            }
        });

        // دکمه تأیید لایسنس
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const input = document.getElementById('verifyLicense').value.trim();
            const result = document.getElementById('verifyResult');
            if (!input) {
                showToast('لطفاً لایسنس را وارد کنید.', 'error');
                return;
            }

            result.style.display = 'block';
            result.innerHTML = '⏳ در حال بررسی...';

            try {
                const response = await verifyLicenseOnServer(input);
                if (response.valid) {
                    result.innerHTML = `✅ لایسنس معتبر است. انقضا: ${response.expiry || response.expires_at || 'نامشخص'}`;
                    showToast('✅ لایسنس معتبر است.', 'success');
                } else {
                    result.innerHTML = `❌ لایسنس نامعتبر است. (${response.reason || response.message || 'بدون دلیل'})`;
                    showToast('❌ لایسنس نامعتبر است.', 'error');
                }
                await loadLicenses(); // به‌روزرسانی لیست و لاگ
            } catch (error) {
                result.innerHTML = `❌ خطا: ${error.message}`;
                showToast(`❌ خطا در تأیید لایسنس: ${error.message}`, 'error');
            }
        });

        // دکمه به‌روزرسانی لیست
        document.getElementById('refreshBtn').addEventListener('click', async () => {
            await loadLicenses();
            showToast('✅ لیست به‌روزرسانی شد.', 'success');
        });

        // دکمه بررسی سرور
        document.getElementById('checkServerBtn').addEventListener('click', async () => {
            await checkServerStatus();
        });

        // دکمه تعلیق همه
        document.getElementById('suspendAllBtn').addEventListener('click', async () => {
            if (!confirm('آیا همه لایسنس‌های فعال را تعلیق می‌کنید؟')) return;
            try {
                const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/suspend-all`, {
                    method: 'POST'
                });
                if (!response.ok) throw new Error('خطا در تعلیق');
                showToast('✅ همه لایسنس‌ها تعلیق شدند.', 'success');
                await loadLicenses();
            } catch (error) {
                showToast(`❌ خطا: ${error.message}`, 'error');
            }
        });

        // دکمه تمدید همه
        document.getElementById('renewAllBtn').addEventListener('click', async () => {
            if (!confirm('آیا همه لایسنس‌ها را برای ۱ سال تمدید می‌کنید؟')) return;
            try {
                const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/renew-all`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: 8760 })
                });
                if (!response.ok) throw new Error('خطا در تمدید');
                showToast('✅ همه لایسنس‌ها تمدید شدند.', 'success');
                await loadLicenses();
            } catch (error) {
                showToast(`❌ خطا: ${error.message}`, 'error');
            }
        });

        // دکمه خروجی گزارش
        document.getElementById('exportBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${LICENSE_SERVER_URL}/api/v1/license/export`);
                if (!response.ok) throw new Error('خطا در دریافت گزارش');
                const data = await response.json();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `license-report-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📊 گزارش با موفقیت ذخیره شد.', 'success');
            } catch (error) {
                showToast(`❌ خطا: ${error.message}`, 'error');
            }
        });
    });

    // تابع کپی برای لایسنس
    function copyLicenseText(id) {
        const text = `LICENSE_ID: ${id}`;
        navigator.clipboard.writeText(text).then(() => {
            showToast('✅ لایسنس کپی شد.', 'success');
        }).catch(() => {
            showToast('📋 لطفاً متن را دستی کپی کنید:\n' + text, 'warning');
        });
    }

    // نمایش آدرس سرور
    document.getElementById('serverUrl').textContent = LICENSE_SERVER_URL;
</script>
</body>
</html>
