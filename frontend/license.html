<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon License Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(12,18,34,0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79,158,255,0.12);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span { font-size: 0.75rem; color: #8fa2dc; display: block; }
        .card {
            background: rgba(20,26,44,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 1.5rem;
        }
        .card h3 {
            font-size: 0.9rem;
            color: #4f9eff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { font-size: 0.7rem; color: #8fa2dc; display: block; margin-bottom: 0.2rem; }
        .form-group input, .form-group select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #1a2240;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            color: white;
            font-size: 0.8rem;
            font-family: monospace;
            outline: none;
        }
        .form-group input:focus { border-color: #4f9eff; }
        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:hover { background: #3a7bd5; transform: scale(1.02); }
        .btn.success { background: #4ade80; }
        .btn.success:hover { background: #22c55e; }
        .btn.gold { background: #facc15; }
        .btn.gold:hover { background: #eab308; }
        .btn.outline { background: transparent; border: 1px solid #4f9eff55; color: #4f9eff; }
        .btn.outline:hover { background: rgba(79,158,255,0.1); }
        .output-box {
            background: #0f172a;
            border-radius: 0.8rem;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.7rem;
            color: #4ade80;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.5rem;
        }
        .badge-group { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .badge {
            background: rgba(79,158,255,0.1);
            border: 1px solid #4f9eff33;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.6rem;
            color: #9bb2ff;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .badge.green { background: rgba(74,222,128,0.12); border-color: #4ade8044; color: #4ade80; }
        .badge.red { background: rgba(248,113,113,0.12); border-color: #f8717144; color: #f87171; }
        .badge.gold { background: rgba(251,191,36,0.12); border-color: #facc1544; color: #facc15; }
        .footer { text-align: center; font-size: 0.65rem; color: #475569; border-top: 1px solid #1a2240; padding-top: 1rem; margin-top: 1.5rem; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #4f9eff; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><i class="fas fa-key" style="color:#4f9eff;"></i> Horizon License Manager</h1>
        <span>پنل مدیریت لایسنس · تولید، تأیید و نظارت</span>
    </div>
    <div class="badge-group">
        <span class="badge green"><i class="fas fa-circle"></i> Status: <span id="statusText">Checking...</span></span>
        <span class="badge blue"><i class="fas fa-tags"></i> Active: <span id="activeCount">0</span></span>
        <span class="badge red"><i class="fas fa-hourglass-end"></i> Expired: <span id="expiredCount">0</span></span>
        <span class="badge gold"><i class="fas fa-clock"></i> Server: <span id="serverUrl">Connecting...</span></span>
    </div>

    <div class="card">
        <h3><i class="fas fa-plus-circle"></i> Generate New License</h3>
        <div class="form-group">
            <label>Product ID</label>
            <input type="text" id="productId" value="horizon-core" />
        </div>
        <div class="form-group">
            <label>User ID (Bank/Industry)</label>
            <input type="text" id="userId" placeholder="bank_melli" value="bank_melli" />
        </div>
        <div class="form-group">
            <label>Duration (hours)</label>
            <input type="number" id="duration" value="8760" />
        </div>
        <button class="btn gold" id="generateBtn"><i class="fas fa-key"></i> Generate License</button>
        <div id="generatedOutput" class="output-box" style="display:none;"></div>
    </div>

    <div class="card">
        <h3><i class="fas fa-check-circle"></i> Verify License</h3>
        <div class="form-group">
            <label>License String</label>
            <input type="text" id="licenseInput" placeholder="Paste license string here" />
        </div>
        <button class="btn success" id="verifyBtn"><i class="fas fa-shield-alt"></i> Verify</button>
        <div id="verifyOutput" class="output-box" style="display:none;"></div>
    </div>

    <div class="footer">
        <span style="color:#4f9eff;">Horizon License Server</span> · Connected to <span style="color:#4ade80;">Real Backend</span>
    </div>
</div>

<script>
// ============================================================
// CONFIG – Real Backend
// ============================================================
const API_BASE = 'https://horizon-backend.liara.run';

// ============================================================
// UI Helpers
// ============================================================
function showToast(msg, type = 'success') {
    alert(msg); // Simple fallback
}

function updateStatus(online) {
    const statusText = document.getElementById('statusText');
    const serverUrl = document.getElementById('serverUrl');
    if (online) {
        statusText.textContent = 'Online';
        statusText.parentElement.className = 'badge green';
        serverUrl.textContent = API_BASE;
    } else {
        statusText.textContent = 'Offline';
        statusText.parentElement.className = 'badge red';
        serverUrl.textContent = '❌ Server not reachable';
    }
}

// ============================================================
// Check server status
// ============================================================
async function checkServerStatus() {
    try {
        const resp = await fetch(`${API_BASE}/api/v1/health`, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            updateStatus(true);
            await loadLicenseList();
            return true;
        }
        throw new Error('Not OK');
    } catch (e) {
        updateStatus(false);
        loadMockData();
        return false;
    }
}

// ============================================================
// Load license list from backend
// ============================================================
async function loadLicenseList() {
    try {
        const resp = await fetch(`${API_BASE}/api/v1/licenses`);
        if (!resp.ok) throw new Error('Failed to fetch licenses');
        const data = await resp.json();
        const licenses = data.licenses || data || [];
        const active = licenses.filter(l => l.status === 'active' || l.status === 'valid');
        const expired = licenses.filter(l => l.status === 'expired' || l.status === 'invalid' || l.status === 'suspended');
        document.getElementById('activeCount').textContent = active.length;
        document.getElementById('expiredCount').textContent = expired.length;
    } catch (e) {
        console.warn('Could not load license list:', e);
    }
}

// ============================================================
// Generate License
// ============================================================
document.getElementById('generateBtn').addEventListener('click', async () => {
    const productId = document.getElementById('productId').value.trim();
    const userId = document.getElementById('userId').value.trim();
    const duration = parseInt(document.getElementById('duration').value) || 8760;
    const output = document.getElementById('generatedOutput');
    if (!productId || !userId) {
        alert('Please enter Product ID and User ID.');
        return;
    }
    output.style.display = 'block';
    output.textContent = '⏳ Generating...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: productId, user_id: userId, duration, volume: 100 })
        });
        const data = await resp.json();
        if (resp.ok) {
            output.textContent = JSON.stringify(data, null, 2);
            await loadLicenseList();
            alert('✅ License generated successfully!');
        } else {
            output.textContent = '❌ Error: ' + (data.error || JSON.stringify(data));
        }
    } catch (e) {
        output.textContent = '❌ Connection error: ' + e.message;
    }
});

// ============================================================
// Verify License
// ============================================================
document.getElementById('verifyBtn').addEventListener('click', async () => {
    const licenseStr = document.getElementById('licenseInput').value.trim();
    const output = document.getElementById('verifyOutput');
    if (!licenseStr) {
        alert('Please enter a license string.');
        return;
    }
    output.style.display = 'block';
    output.textContent = '⏳ Verifying...';
    try {
        const resp = await fetch(`${API_BASE}/api/v1/license/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ license: licenseStr })
        });
        const data = await resp.json();
        if (resp.ok && data.valid) {
            output.textContent = '✅ License is valid.';
            output.style.color = '#4ade80';
        } else {
            output.textContent = '❌ License is invalid or expired.';
            output.style.color = '#f87171';
        }
    } catch (e) {
        output.textContent = '❌ Connection error: ' + e.message;
    }
});

// ============================================================
// Mock data fallback (if backend is down)
// ============================================================
function loadMockData() {
    document.getElementById('activeCount').textContent = '3';
    document.getElementById('expiredCount').textContent = '1';
}

// ============================================================
// Init
// ============================================================
window.onload = function() {
    checkServerStatus();
    setInterval(checkServerStatus, 30000);
};
</script>
</body>
</html>
