<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین · Horizon Angel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{font-family:Tahoma;box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#020617,#1e1b4b);color:#eef2ff;min-height:100vh;padding:2rem}
.cont{max-width:1400px;margin:0 auto}
.card{background:rgba(15,23,42,.8);backdrop-filter:blur(20px);border:1px solid rgba(79,158,255,.2);border-radius:1.5rem;padding:2rem;margin-bottom:1.5rem}
.login-box{max-width:450px;margin:5rem auto}
.login-box h1{text-align:center;font-size:2rem;background:linear-gradient(135deg,#4f9eff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.5rem}
.login-box p{text-align:center;color:#8fa2dc;font-size:.85rem;margin-bottom:2rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:.75rem;color:#8fa2dc;margin-bottom:.4rem}
.fg input,.fg select{width:100%;background:#020617;border:1px solid #334155;border-radius:.8rem;padding:.9rem;color:#fff;font-size:.9rem;font-family:monospace;outline:none}
.fg input:focus,.fg select:focus{border-color:#4f9eff;box-shadow:0 0 20px rgba(79,158,255,.3)}
.btn{background:linear-gradient(135deg,#4f9eff,#c084fc);color:#fff;border:none;padding:.9rem 2rem;border-radius:1rem;font-weight:700;cursor:pointer;font-size:.9rem;width:100%;font-family:Tahoma}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(79,158,255,.5)}
.btn-sm{width:auto;padding:.5rem 1rem;font-size:.75rem;border-radius:.6rem}
.btn-danger{background:linear-gradient(135deg,#f87171,#dc2626)}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
.hdr h1{font-size:1.5rem;color:#4f9eff}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;border-bottom:1px solid rgba(79,158,255,.2);padding-bottom:.5rem}
.tab{padding:.6rem 1.2rem;background:transparent;border:none;color:#8fa2dc;cursor:pointer;border-radius:.6rem;font-family:Tahoma;font-size:.85rem;transition:.2s}
.tab:hover{background:rgba(79,158,255,.1)}
.tab.active{background:linear-gradient(135deg,#4f9eff,#c084fc);color:#fff;font-weight:700}
.panel{display:none}
.panel.active{display:block}
.tbl{width:100%;border-collapse:collapse;border-radius:1rem;overflow:hidden;margin-top:1rem}
.tbl th{background:linear-gradient(135deg,#1e293b,#0f172a);color:#4f9eff;padding:.9rem;text-align:right;font-size:.75rem}
.tbl td{padding:.8rem 1rem;border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
.tbl tr:hover td{background:rgba(79,158,255,.05)}
.hash{color:#c084fc;font-family:monospace;font-size:.7rem;word-break:break-all}
.status-badge{background:rgba(74,222,128,.15);color:#4ade80;padding:.25rem .7rem;border-radius:20px;font-size:.7rem;font-weight:700;display:inline-block}
.status-badge.revoked{background:rgba(248,113,113,.15);color:#f87171}
.status-badge.expired{background:rgba(250,204,21,.15);color:#facc15}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{text-align:center;padding:1.2rem;background:rgba(0,0,0,.3);border-radius:1rem;border:1px solid rgba(79,158,255,.15)}
.stat .num{font-size:2rem;font-weight:900;color:#4ade80}
.stat .lbl{font-size:.75rem;color:#8fa2dc;margin-top:.3rem}
.empty{text-align:center;color:#94a3b8;padding:2rem;font-size:.85rem}
.toast{position:fixed;top:2rem;left:50%;transform:translateX(-50%);background:#1e293b;padding:1rem 2rem;border-radius:1rem;border:1px solid #4f9eff;color:#fff;z-index:9999;display:none;font-size:.9rem}
.toast.success{border-color:#4ade80;color:#4ade80}
.toast.error{border-color:#f87171;color:#f87171}
</style>
</head>
<body>
<div class="cont">

<!-- LOGIN -->
<div id="login-screen" class="login-box card">
<h1><i class="fas fa-shield-halved"></i> پنل ادمین</h1>
<p>Horizon Angel · دسترسی مدیریت</p>
<div class="fg">
<label>رمز عبور ادمین</label>
<input type="password" id="admin-pass" placeholder="HorizonAdmin@2026!">
</div>
<button class="btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> ورود</button>
<div id="login-status" style="text-align:center;font-size:.8rem;color:#8fa2dc;margin-top:1rem"></div>
</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none">

<div class="hdr">
<div>
<h1><i class="fas fa-shield-halved"></i> پنل ادمین Horizon</h1>
<div style="font-size:.8rem;color:#8fa2dc;margin-top:.3rem">
اتصال: <span id="conn-status" style="color:#4ade80">●</span>
<span id="conn-url" style="font-family:monospace;font-size:.7rem"></span>
</div>
</div>
<button class="btn btn-sm" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
</div>

<!-- STATS -->
<div class="stats-grid">
<div class="stat"><div class="num" id="s-blocks">—</div><div class="lbl">بلوک‌ها</div></div>
<div class="stat"><div class="num" id="s-tx">—</div><div class="lbl">تراکنش‌ها</div></div>
<div class="stat"><div class="num" id="s-lic">—</div><div class="lbl">لایسنس‌ها</div></div>
<div class="stat"><div class="num" id="s-pending">—</div><div class="lbl">در انتظار</div></div>
</div>

<!-- TABS -->
<div class="tabs">
<button class="tab active" onclick="showTab('banks', this)"><i class="fas fa-university"></i> بانک‌ها</button>
<button class="tab" onclick="showTab('licenses', this)"><i class="fas fa-key"></i> لایسنس‌ها</button>
<button class="tab" onclick="showTab('issue', this)"><i class="fas fa-plus-circle"></i> صدور لایسنس</button>
<button class="tab" onclick="showTab('audit', this)"><i class="fas fa-list"></i> لاگ عملیات</button>
</div>

<!-- PANEL: BANKS -->
<div id="p-banks" class="panel active card">
<h3 style="color:#4f9eff;margin-bottom:1rem"><i class="fas fa-university"></i> بانک‌ها و لایسنس‌ها</h3>
<div id="banks-list"><div class="empty">در حال بارگذاری...</div></div>
</div>

<!-- PANEL: LICENSES -->
<div id="p-licenses" class="panel card">
<h3 style="color:#4f9eff;margin-bottom:1rem"><i class="fas fa-key"></i> همه لایسنس‌ها</h3>
<div id="licenses-list"><div class="empty">در حال بارگذاری...</div></div>
</div>

<!-- PANEL: ISSUE -->
<div id="p-issue" class="panel card">
<h3 style="color:#4f9eff;margin-bottom:1rem"><i class="fas fa-plus-circle"></i> صدور لایسنس جدید</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:800px">
<div class="fg"><label>شناسه لایسنس *</label><input id="i-licid" placeholder="lic_bank_xxx_001"></div>
<div class="fg"><label>کاربر (بانک) *</label><input id="i-user" placeholder="bank_xxx"></div>
<div class="fg"><label>محصول</label><input id="i-product" value="horizon-core"></div>
<div class="fg"><label>حجم (تعداد تراکنش)</label><input id="i-volume" type="number" value="1000000"></div>
<div class="fg"><label>مدت (ساعت)</label><input id="i-duration" type="number" value="8760"></div>
<div class="fg"><label>Merkle Root (اختیاری)</label><input id="i-merkle" placeholder="80140c57..."></div>
</div>
<button class="btn" style="max-width:400px;margin-top:1rem" onclick="issueLicense()">
<i class="fas fa-signature"></i> امضا و صدور لایسنس
</button>
<div id="issue-result" style="margin-top:1rem"></div>
</div>

<!-- PANEL: AUDIT -->
<div id="p-audit" class="panel card">
<h3 style="color:#4f9eff;margin-bottom:1rem"><i class="fas fa-list"></i> لاگ عملیات ادمین</h3>
<div id="audit-list"><div class="empty">در حال بارگذاری...</div></div>
</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>
var SWITCH_URL = 'http://localhost:8080';
var token = null;

// ============ LOGIN ============
function doLogin() {
    var pass = document.getElementById('admin-pass').value.trim();
    var st = document.getElementById('login-status');
    if (!pass) { st.innerHTML = '<span style="color:#f87171">❌ پسورد را وارد کنید</span>'; return; }
    st.innerHTML = '⏳ در حال بررسی...';
    fetch(SWITCH_URL + '/api/v1/admin/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({password: pass})
    }).then(r => r.json()).then(d => {
        if (d.status === 'ok') {
            token = d.token;
            localStorage.setItem('hz_admin_token', token);
            st.innerHTML = '<span style="color:#4ade80">✅ ورود موفق</span>';
            setTimeout(showDash, 400);
        } else {
            st.innerHTML = '<span style="color:#f87171">❌ ' + (d.error || 'خطا') + '</span>';
        }
    }).catch(e => {
        st.innerHTML = '<span style="color:#f87171">❌ ' + e.message + '</span>';
    });
}

function doLogout() {
    if (token) {
        fetch(SWITCH_URL + '/api/v1/admin/logout', {
            method: 'POST',
            headers: {'X-Admin-Token': token}
        }).catch(()=>{});
    }
    localStorage.removeItem('hz_admin_token');
    location.reload();
}

function showDash() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('conn-url').textContent = SWITCH_URL;
    loadAll();
    setInterval(loadAll, 20000);
}

// ============ TABS ============
function showTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('p-' + name).classList.add('active');
    if (name === 'banks') loadBanks();
    if (name === 'licenses') loadLicenses();
    if (name === 'audit') loadAudit();
}

// ============ HELPERS ============
function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({'X-Admin-Token': token}, opts.headers || {});
    return fetch(SWITCH_URL + path, opts).then(r => r.json());
}

function toast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

// ============ LOADERS ============
function loadAll() {
    fetch(SWITCH_URL + '/api/v1/stats').then(r => r.json()).then(d => {
        document.getElementById('s-blocks').textContent = d.chainLength || 0;
        document.getElementById('s-tx').textContent = d.totalTx || 0;
        document.getElementById('s-lic').textContent = d.licenses || 0;
        document.getElementById('s-pending').textContent = d.pendingTx || 0;
    }).catch(()=>{});
    loadBanks();
}

function loadBanks() {
    api('/api/v1/admin/banks').then(d => {
        var el = document.getElementById('banks-list');
        if (!d.banks || d.banks.length === 0) {
            el.innerHTML = '<div class="empty">هیچ بانکی نیست</div>';
            return;
        }
        var html = '<table class="tbl"><thead><tr>' +
            '<th>بانک</th><th>لایسنس</th><th>حجم</th><th>موجودی</th>' +
            '<th>انقضا</th><th>وضعیت</th><th>آدرس امضا</th>' +
            '</tr></thead><tbody>';
        d.banks.forEach(b => {
            var lic = b.license;
            var expires = lic ? new Date(lic.expires_at * 1000).toLocaleDateString('fa-IR') : '—';
            var sig = lic ? (lic.signature || '').slice(0, 16) + '...' : '—';
            var st = lic ? '<span class="status-badge ' + (lic.status === 'active' ? '' : 'revoked') + '">' + lic.status + '</span>' : '—';
            var bal = (b.balance || 0).toLocaleString('fa-IR');
            var balColor = (b.balance || 0) > 0 ? '#4ade80' : '#f87171';

            html += '<tr>';
            html += '<td><b>' + b.bank_id + '</b><br><span style="color:#8fa2dc;font-size:.7rem">' + (b.bank_name || '') + '</span></td>';
            html += '<td style="font-family:monospace;font-size:.75rem">' + (lic ? lic.license_id : '—') + '</td>';
            html += '<td>' + (lic ? (lic.volume || 0).toLocaleString('fa-IR') : '—') + '</td>';
            html += '<td style="font-family:monospace;font-weight:700;color:' + balColor + '">' + bal + '</td>';
            html += '<td>' + expires + '</td>';
            html += '<td>' + st + '</td>';
            html += '<td class="hash">' + sig + '</td>';
            html += '</tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }).catch(e => {
        document.getElementById('banks-list').innerHTML =
            '<div class="empty" style="color:#f87171">خطا: ' + e.message + '</div>';
    });
}

function loadLicenses() {
    fetch(SWITCH_URL + '/api/v1/license/list').then(r => r.json()).then(d => {
        var el = document.getElementById('licenses-list');
        var list = d.licenses || [];
        if (list.length === 0) { el.innerHTML = '<div class="empty">هیچ لایسنسی نیست</div>'; return; }
        var html = '<table class="tbl"><thead><tr><th>شناسه</th><th>کاربر</th><th>حجم</th><th>موجودی</th><th>وضعیت</th><th>صادر</th><th>انقضا</th><th>امضا</th><th></th></tr></thead><tbody>';
        list.forEach(l => {
            var issued = new Date(l.issued_at * 1000).toLocaleDateString('fa-IR');
            var expires = new Date(l.expires_at * 1000).toLocaleDateString('fa-IR');
            var stCls = l.status === 'active' ? '' : 'revoked';
            html += '<tr>';
            html += '<td style="font-family:monospace;font-size:.75rem">' + l.license_id + '</td>';
            html += '<td>' + l.user_id + '</td>';
            html += '<td>' + (l.volume||0).toLocaleString('fa-IR') + '</td>';
            html += '<td><span class="status-badge ' + stCls + '">' + l.status + '</span></td>';
            html += '<td>' + issued + '</td>';
            html += '<td>' + expires + '</td>';
            html += '<td class="hash">' + (l.signature||'').slice(0,16) + '...</td>';
            html += '<td>' + (l.status === 'active'
                ? '<button class="btn btn-sm btn-danger" onclick="revoke(\'' + l.license_id + '\')">باطل</button>'
                : '—') + '</td>';
            html += '</tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }).catch(()=>{});
}

function loadAudit() {
    api('/api/v1/admin/audit').then(d => {
        var el = document.getElementById('audit-list');
        var list = d.entries || [];
        if (list.length === 0) { el.innerHTML = '<div class="empty">لاگی نیست</div>'; return; }
        var html = '<table class="tbl"><thead><tr><th>#</th><th>زمان</th><th>عملیات</th><th>هدف</th><th>جزئیات</th><th>IP</th></tr></thead><tbody>';
        list.forEach(e => {
            var t = new Date(e.timestamp * 1000).toLocaleString('fa-IR');
            html += '<tr>';
            html += '<td>' + e.id + '</td>';
            html += '<td style="font-size:.75rem">' + t + '</td>';
            html += '<td><b style="color:#4f9eff">' + e.action + '</b></td>';
            html += '<td style="font-family:monospace;font-size:.7rem">' + (e.target||'—') + '</td>';
            html += '<td style="font-size:.75rem">' + (e.details||'—') + '</td>';
            html += '<td style="font-family:monospace;font-size:.7rem">' + (e.ip||'—') + '</td>';
            html += '</tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    }).catch(()=>{});
}

// ============ ACTIONS ============
function issueLicense() {
    var body = {
        license_id: document.getElementById('i-licid').value.trim(),
        user_id: document.getElementById('i-user').value.trim(),
        product_id: document.getElementById('i-product').value.trim(),
        volume: parseInt(document.getElementById('i-volume').value) || 0,
        duration: parseInt(document.getElementById('i-duration').value) || 8760,
        merkle_root: document.getElementById('i-merkle').value.trim()
    };
    if (!body.license_id || !body.user_id) {
        toast('شناسه لایسنس و کاربر الزامی است', 'error');
        return;
    }
    var el = document.getElementById('issue-result');
    el.innerHTML = '⏳ در حال امضا...';
    api('/api/v1/admin/license/issue', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
    }).then(d => {
        if (d.error) {
            el.innerHTML = '<span style="color:#f87171">❌ ' + d.error + '</span>';
            toast('خطا: ' + d.error, 'error');
            return;
        }
        toast('✅ لایسنس صادر و امضا شد', 'success');
        el.innerHTML = '<div style="background:rgba(74,222,128,.1);border:1px solid #4ade80;padding:1rem;border-radius:1rem;font-size:.8rem;font-family:monospace">' +
            '<div>✅ <b>' + d.license_id + '</b> صادر شد</div>' +
            '<div style="color:#4ade80;margin-top:.5rem;word-break:break-all">' + d.signature + '</div>' +
            '</div>';
        loadLicenses();
    }).catch(e => {
        el.innerHTML = '<span style="color:#f87171">❌ ' + e.message + '</span>';
    });
}

function revoke(licenseId) {
    if (!confirm('لایسنس ' + licenseId + ' باطل شود؟')) return;
    api('/api/v1/admin/license/revoke', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({license_id: licenseId})
    }).then(d => {
        if (d.error) { toast('خطا: ' + d.error, 'error'); return; }
        toast('✅ لایسنس باطل شد', 'success');
        loadLicenses();
        loadBanks();
    }).catch(e => toast('خطا: ' + e.message, 'error'));
}

// ============ AUTO-LOGIN ============
window.addEventListener('DOMContentLoaded', () => {
    var saved = localStorage.getItem('hz_admin_token');
    if (saved) {
        token = saved;
        fetch(SWITCH_URL + '/api/v1/admin/audit', {
            headers: {'X-Admin-Token': token}
        }).then(r => {
            if (r.status === 401) {
                token = null;
                localStorage.removeItem('hz_admin_token');
            } else {
                showDash();
            }
        }).catch(()=>{});
    }
});
</script>
</body>
</html>
