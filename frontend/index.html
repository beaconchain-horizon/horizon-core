<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Angel Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">
    <header class="bg-gray-800 shadow-lg border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-angel text-yellow-400 text-3xl"></i>
                <span class="text-2xl font-bold text-blue-400">Horizon<span class="text-yellow-400">Angel</span></span>
            </div>
            <nav class="hidden md:flex gap-6 text-sm">
                <a href="index.html" class="hover:text-yellow-400">خانه</a>
                <a href="products.html" class="hover:text-yellow-400">محصولات</a>
                <a href="dashboard.html" class="hover:text-yellow-400">پنل کاربری</a>
                <a href="admin.html" class="hover:text-yellow-400">مدیریت</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="relative">
                    <i class="fas fa-shopping-cart text-xl hover:text-yellow-400"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold rounded-full px-2 py-0.5">0</span>
                </a>
                <a href="login.html" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">ورود</a>
            </div>
        </div>
    </header>
    <section class="bg-gradient-to-r from-blue-900 to-gray-900 py-20 text-center">
        <div class="container mx-auto px-4">
            <i class="fas fa-shield-alt text-7xl text-yellow-400 mb-4"></i>
            <h1 class="text-5xl font-bold mb-4">خرید لایسنس امن و آفلاین</h1>
            <p class="text-xl text-gray-300 mb-8">Horizon Angel Core Engine · ECDSA · Merkle Tree</p>
            <a href="products.html" class="bg-yellow-400 text-black px-8 py-4 rounded-lg font-bold text-lg hover:bg-yellow-300">مشاهده محصولات</a>
        </div>
    </section>
    <section class="container mx-auto px-4 py-16">
        <h2 class="text-3xl font-bold text-center mb-12">محصولات ویژه</h2>
        <div id="featured-products" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
    </section>
    <footer class="bg-gray-800 py-6 text-center text-gray-400 border-t border-gray-700">
        <p>© 2025 Horizon Angel. تمامی حقوق محفوظ است.</p>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadFeaturedProducts();
            updateCartBadge();
        });
        async function loadFeaturedProducts() {
            try {
                const data = await apiGet('/api/v1/licenses');
                const container = document.getElementById('featured-products');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center col-span-3">هیچ محصولی یافت نشد</p>';
                    return;
                }
                container.innerHTML = data.slice(0, 3).map(p => `
                    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 hover:border-yellow-400 transition">
                        <i class="fas fa-file-signature text-4xl text-blue-400 mb-4"></i>
                        <h3 class="text-xl font-bold">${p.product_id || 'Horizon Core'}</h3>
                        <p class="text-gray-400">حجم: ${p.volume || 'نامشخص'}</p>
                        <p class="text-yellow-400 font-bold mt-2">${p.price || 'تماس بگیرید'}</p>
                        <a href="product-detail.html?id=${p.id}" class="inline-block mt-4 bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">مشاهده</a>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('featured-products').innerHTML = '<p class="text-red-400 text-center col-span-3">خطا در بارگذاری محصولات</p>';
            }
        }
    </script>
</body>
</html>
