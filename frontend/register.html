<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | Horizon</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-6">ثبت‌نام</h2>
        <input type="text" placeholder="نام کامل" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 mb-4 text-white">
        <input type="email" placeholder="ایمیل" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 mb-4 text-white">
        <input type="password" placeholder="رمز عبور" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 mb-4 text-white">
        <button onclick="alert('ثبت‌نام موفق')" class="w-full bg-yellow-400 text-black py-2 rounded-lg font-bold hover:bg-yellow-300">ثبت‌نام</button>
        <p class="text-center text-gray-400 mt-4"><a href="login.html" class="text-blue-400">ورود</a></p>
    </div>
<script src="offline-storage.js"></script>
</body>
</html>
