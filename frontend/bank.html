<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل بانک | Horizon Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: #060b18; color: #eef2ff; padding: 1rem; }
        .card { background: #0f172a; border: 1px solid #1a2240; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; }
        input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; background: #020617; border: 1px solid #1a2240; border-radius: 0.5rem; color: white; }
        button { background: #4ade80; border: none; padding: 0.7rem 1.5rem; border-radius: 2rem; color: #000; font-weight: bold; cursor: pointer; }
        .output { background: #020617; padding: 1rem; border-radius: 0.5rem; color: #4ade80; font-family: monospace; }
    </style>
</head>
<body>
    <h1>پنل شبکه بانکی</h1>
    <div class="card">
        <h2>ثبت تراکنش</h2>
        <input type="number" id="amount" placeholder="مبلغ (ریال)">
        <button onclick="submitTx()">ثبت تراکنش</button>
        <div class="output" id="output">وضعیت: آماده...</div>
    </div>
    <script>
        const API_BASE = 'https://horizon-backend.liara.run';
        async function submitTx() {
            const body = { amount: parseInt(document.getElementById('amount').value), status: 'confirmed' };
            try {
                const res = await fetch(API_BASE + '/api/v1/transactions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                document.getElementById('output').innerText = JSON.stringify(await res.json(), null, 2);
            } catch (e) { document.getElementById('output').innerText = 'Error: ' + e.message; }
        }
    </script>
</body>
</html>
