<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانک مرکزی | Horizon</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-4">بانک مرکزی</h1>
        <p class="text-gray-400">مدیریت IPهای مالی و کنترل مرکزی</p>
        <div class="mt-6 bg-gray-800 p-6 rounded-xl border border-gray-700">
            <table class="w-full text-sm">
                <tr class="border-b border-gray-700"><th class="text-right py-2">IP</th><th class="text-right">وضعیت</th><th class="text-right">مبلغ</th></tr>
                <tr><td class="py-2">192.168.1.1</td><td><span class="text-green-400">آنلاین</span></td><td>۱۵,۰۰۰,۰۰۰</td></tr>
                <tr><td class="py-2">192.168.1.2</td><td><span class="text-red-400">آفلاین</span></td><td>۷,۲۰۰,۰۰۰</td></tr>
            </table>
        </div>
    </div>
<script src="offline-storage.js"></script>
</body>
</html>
