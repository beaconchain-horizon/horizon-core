<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سنسورها · Horizon</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="cont">
<header class="hdr"><div class="greeting"><h1>پایش <b>سنسورها</b></h1><p><span class="live-dot"></span> ۲۴ سنسور فعال</p></div>
<nav class="hdr-widgets"><a href="index.html" class="widget">فروشگاه</a><a href="dashboard.html" class="widget">داشبورد</a><a href="sensors.html" class="widget active">سنسورها</a><a href="blocks.html" class="widget">بلاک‌ها</a></nav></header>
<section id="sensor-grid" class="features-grid"></section>
</div>
<script src="config.js"></script><script src="js/demo-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const data = await fetchDemoData('sensors');
  const el = document.getElementById('sensor-grid');
  el.innerHTML = data.map(s => {
    const color = s.status === 'critical' ? '#ef4444' : s.status === 'warn' ? '#f59e0b' : '#4ade80';
    return `<div class="feat-card" style="border-right:4px solid ${color}">
      <h4>${s.id} <span style="color:${color};font-size:.7rem">●</span></h4>
      <p><b>${s.site}</b></p>
      <p style="font-size:1.8rem;color:${color};font-family:monospace;margin:.5rem 0">${s.value} ${s.unit}</p>
      <p style="font-size:.7rem">محدوده: ${s.min} - ${s.max} ${s.unit}</p>
    </div>`;
  }).join('');
});
</script>
</body></html>
