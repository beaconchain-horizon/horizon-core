<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon DEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(12,18,34,0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79,158,255,0.12);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card {
            background: rgba(20,26,44,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 1.5rem;
        }
        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:hover { background: #3a7bd5; transform: scale(1.02); }
        .btn.success { background: #4ade80; }
        .btn.success:hover { background: #22c55e; }
        .btn.danger { background: #f87171; }
        .btn.danger:hover { background: #ef4444; }
        .btn.gold { background: #facc15; }
        .btn.gold:hover { background: #eab308; }
        .footer { text-align: center; font-size: 0.65rem; color: #475569; border-top: 1px solid #1a2240; padding-top: 1rem; margin-top: 1.5rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { font-size: 0.7rem; color: #8fa2dc; display: block; margin-bottom: 0.2rem; }
        .form-group input { width: 100%; background: #0f172a; border: 1px solid #1a2240; padding: 0.5rem 0.8rem; border-radius: 0.8rem; color: white; font-size: 0.8rem; outline: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><i class="fas fa-exchange-alt" style="color:#c084fc;"></i> Horizon DEX</h1>
    </div>
    <div class="card">
        <p style="color:#8fa2dc;">Decentralized Exchange · Demo</p>
        <div class="form-group">
            <label>Pair</label>
            <input type="text" id="pair" value="BTC/USDT" />
        </div>
        <div class="form-group">
            <label>Amount</label>
            <input type="number" id="amount" value="0.01" />
        </div>
        <button class="btn success" id="buyBtn"><i class="fas fa-arrow-up"></i> Buy</button>
        <button class="btn danger" id="sellBtn"><i class="fas fa-arrow-down"></i> Sell</button>
        <div id="dexOutput" style="margin-top:1rem;background:#0f172a;padding:0.5rem;border-radius:0.8rem;font-size:0.7rem;color:#4ade80;display:none;"></div>
    </div>
    <div class="footer">Horizon DEX · Demo</div>
</div>

<script>
document.getElementById('buyBtn').addEventListener('click', function() {
    const out = document.getElementById('dexOutput');
    out.style.display = 'block';
    out.textContent = '✅ Buy order placed for ' + document.getElementById('amount').value + ' ' + document.getElementById('pair').value;
    out.style.color = '#4ade80';
});

document.getElementById('sellBtn').addEventListener('click', function() {
    const out = document.getElementById('dexOutput');
    out.style.display = 'block';
    out.textContent = '✅ Sell order placed for ' + document.getElementById('amount').value + ' ' + document.getElementById('pair').value;
    out.style.color = '#facc15';
});
</script>
<script src="offline-storage.js"></script>
</body>
</html>
