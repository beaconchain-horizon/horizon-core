<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Saderat · Horizon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #eef2ff;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(12,18,34,0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid rgba(79,158,255,0.12);
            padding: 1.8rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width:768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card {
            background: rgba(20,26,44,0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .card h3 { font-size: 0.9rem; color: #4f9eff; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .btn {
            background: #4f9eff;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            color: #0a0f1e;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.3rem 0;
        }
        .btn:hover { background: #3a7bd5; transform: scale(1.02); }
        .btn.success { background: #4ade80; }
        .btn.success:hover { background: #22c55e; }
        .btn.gold { background: #facc15; }
        .btn.gold:hover { background: #eab308; }
        .btn.outline { background: transparent; border: 1px solid #4f9eff55; color: #4f9eff; }
        .btn.outline:hover { background: rgba(79,158,255,0.1); }
        .map-container { height: 250px; border-radius: 1.2rem; overflow: hidden; border: 1px solid rgba(79,158,255,0.1); }
        #map { height: 100%; width: 100%; }
        .footer { text-align: center; font-size: 0.65rem; color: #475569; border-top: 1px solid #1a2240; padding-top: 1rem; margin-top: 1.5rem; }
        .tx-item { background: rgba(0,0,0,0.2); border-radius: 0.7rem; padding: 0.3rem 0.8rem; margin-bottom: 0.3rem; font-size: 0.7rem; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid #4f9eff; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><i class="fas fa-university" style="color:#4f9eff;"></i> Bank Saderat Dashboard</h1>
    </div>
    <div class="grid-2">
        <div class="card">
            <h3><i class="fas fa-exchange-alt"></i> Transactions</h3>
            <div id="txList" style="max-height:200px;overflow-y:auto;">
                <div class="tx-item"><span>Loading...</span></div>
            </div>
            <button class="btn gold" id="newTxBtn"><i class="fas fa-plus"></i> New Transaction</button>
            <button class="btn success" id="syncBtn"><i class="fas fa-cloud-upload-alt"></i> Force Sync</button>
        </div>
        <div class="card">
            <h3><i class="fas fa-map-marked-alt"></i> Branch Map</h3>
            <div class="map-container"><div id="map"></div></div>
        </div>
    </div>
    <div class="footer">Bank Saderat · Connected to Real Backend</div>
</div>

<script>
const API_BASE = 'https://horizon-backend.liara.run';
let map = null;

function initMap() {
    if (map) return;
    map = L.map('map', { center: [35.6892, 51.3890], zoom: 10, zoomControl: false, attributionControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CartoDB', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
    L.marker([35.6892, 51.3890]).addTo(map).bindPopup('Central Branch');
}

async function loadTransactions() {
    try {
        const resp = await fetch(`${API_BASE}/api/v1/transactions?limit=10`);
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        const txList = document.getElementById('txList');
        const txs = data.transactions || data || [];
        if (txs.length === 0) {
            txList.innerHTML = '<div class="tx-item">No transactions found.</div>';
        } else {
            txList.innerHTML = txs.slice(0,10).map(tx => `
                <div class="tx-item">
                    <span>${tx.from || 'Unknown'} → ${tx.to || 'Unknown'}</span>
                    <span style="color:#4ade80;">${tx.amount || 0} Rial</span>
                    <span style="font-size:0.55rem;color:#8fa2dc;">${tx.status || 'pending'}</span>
                </div>
            `).join('');
        }
    } catch (e) {
        document.getElementById('txList').innerHTML = '<div class="tx-item">⚠️ Could not load transactions.</div>';
    }
}

document.getElementById('newTxBtn').addEventListener('click', async () => {
    const amount = Math.floor(Math.random() * 10000000 + 100000);
    try {
        const resp = await fetch(`${API_BASE}/api/v1/transactions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount, type: 'deposit', status: 'confirmed' })
        });
        if (resp.ok) {
            alert('✅ Transaction added.');
            await loadTransactions();
        } else {
            alert('❌ Failed to add transaction.');
        }
    } catch (e) {
        alert('❌ Connection error.');
    }
});

document.getElementById('syncBtn').addEventListener('click', () => {
    alert('🔄 Sync triggered. Check backend logs.');
});

window.onload = function() {
    initMap();
    loadTransactions();
    setInterval(loadTransactions, 15000);
};
</script>
<script src="offline-storage.js"></script>
</body>
</html>
