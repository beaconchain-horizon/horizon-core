<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Certificate of Commercial Record</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'Inter',sans-serif;color:#1a1a1a;padding:40px 20px;min-height:100vh}
.certificate{max-width:900px;margin:0 auto;background:#fefefe;position:relative;box-shadow:0 0 80px rgba(0,0,0,.6),0 0 0 1px rgba(212,175,55,.3);overflow:hidden}
.certificate::before{content:'';position:absolute;inset:0;padding:8px;background:linear-gradient(135deg,#d4af37 0%,#f4d03f 10%,#d4af37 20%,#b8860b 30%,#d4af37 40%,#f9e79f 50%,#d4af37 60%,#b8860b 70%,#d4af37 80%,#f4d03f 90%,#d4af37 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:10;pointer-events:none}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:200px;font-weight:900;color:rgba(212,175,55,.04);font-family:'Playfair Display',serif;pointer-events:none;z-index:0;letter-spacing:20px}
.cert-inner{position:relative;z-index:2;padding:60px 70px}
.header{text-align:center;padding-bottom:30px;border-bottom:2px solid #d4af37;position:relative}
.header::after{content:'\25C6 \25C6 \25C6';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#fefefe;padding:0 15px;color:#d4af37;font-size:11px;letter-spacing:8px}
.emblem{width:90px;height:90px;margin:0 auto 20px;background:linear-gradient(135deg,#1a3d34,#0a1a1f);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #d4af37}
.emblem-inner{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:#d4af37}
.institution{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:#0a1a1f;letter-spacing:4px;margin-bottom:8px}
.institution-sub{font-size:12px;color:#666;letter-spacing:6px;text-transform:uppercase;font-weight:500}
.title-section{text-align:center;padding:40px 0 30px}
.doc-type{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:8px;color:#d4af37;text-transform:uppercase;margin-bottom:12px;font-weight:700}
.doc-title{font-family:'Playfair Display',serif;font-size:44px;font-weight:900;color:#0a1a1f;line-height:1.2;margin-bottom:10px}
.doc-subtitle{font-size:15px;color:#555;font-style:italic;font-family:'Playfair Display',serif}
.gold-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0}
.gold-divider::before,.gold-divider::after{content:'';height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);flex:1;max-width:200px}
.gold-divider-icon{color:#d4af37;font-size:14px;letter-spacing:4px}
.section{margin-bottom:32px}
.section-label{font-size:10px;font-weight:700;letter-spacing:3px;color:#d4af37;text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(212,175,55,.3)}
.section-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#0a1a1f;margin-bottom:14px}
.section p{font-size:14px;line-height:1.8;color:#333;margin-bottom:12px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;margin:20px 0}
.detail-item{padding:14px 0;border-bottom:1px solid #eee}
.detail-label{font-size:10px;font-weight:600;letter-spacing:2px;color:#888;text-transform:uppercase;margin-bottom:6px}
.detail-value{font-size:15px;font-weight:600;color:#0a1a1f}
.detail-value.mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:#1a3d34}
.verified-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1a3d34,#0a1a1f);color:#d4af37;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
.verified-badge::before{content:'\2713';font-weight:900}
.signature-block{margin-top:40px;padding:30px;background:linear-gradient(135deg,#faf8f3,#f5f0e6);border:1px solid #d4af37;border-radius:8px}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.sig-party{text-align:center}
.sig-party-role{font-size:10px;font-weight:700;letter-spacing:2px;color:#d4af37;text-transform:uppercase;margin-bottom:10px}
.sig-party-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#0a1a1f;margin-bottom:4px}
.sig-party-title{font-size:11px;color:#666;margin-bottom:16px}
.sig-line{border-top:1px solid #0a1a1f;margin:40px 30px 8px;padding-top:8px;font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase}
.doc-id-block{margin-top:30px;padding:20px;background:#0a1a1f;color:#7ef2c4;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.8}
.doc-id-block strong{color:#d4af37;font-weight:600}
.footer{margin-top:40px;padding-top:20px;border-top:2px solid #d4af37;text-align:center;font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase}
.holo-seal{position:absolute;top:40px;right:40px;width:110px;height:110px;border-radius:50%;background:conic-gradient(from 0deg,#d4af37,#f4d03f,#7ef2c4,#c084fc,#d4af37,#f4d03f,#7ef2c4,#c084fc,#d4af37);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(212,175,55,.4);z-index:5;animation:holoPulse 4s ease-in-out infinite}
@keyframes holoPulse{0%,100%{transform:scale(1) rotate(0deg);filter:hue-rotate(0deg)}50%{transform:scale(1.03) rotate(5deg);filter:hue-rotate(30deg)}}
.holo-seal-inner{width:88px;height:88px;border-radius:50%;background:#fefefe;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #d4af37}
.holo-seal-text{font-family:'Playfair Display',serif;font-size:9px;font-weight:900;color:#0a1a1f;letter-spacing:1px;text-align:center;line-height:1.3}
.holo-seal-year{font-family:'Playfair Display',serif;font-size:14px;font-weight:900;color:#d4af37;margin:3px 0}
</style>
</head>
<body>
<div class="certificate">
<div class="watermark">HORIZON</div>
<div class="holo-seal">
<div class="holo-seal-inner">
<div class="holo-seal-text">CERTIFIED</div>
<div class="holo-seal-year">2020</div>
<div class="holo-seal-text">VERIFIED</div>
</div>
</div>
<div class="cert-inner">
<div class="header">
<div class="emblem"><div class="emblem-inner">H</div></div>
<div class="institution">HORIZON</div>
<div class="institution-sub">Global Blockchain Protocol</div>
</div>
<div class="title-section">
<div class="doc-type">Certificate of Commercial Record</div>
<div class="doc-title">Verified Commercial History</div>
<div class="doc-subtitle">A documented record of international business engagement</div>
</div>
<div class="gold-divider"><span class="gold-divider-icon">&#9670; &#9670; &#9670;</span></div>
