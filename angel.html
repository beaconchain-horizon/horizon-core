<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Horizon Angel</title>
<link rel="stylesheet" href="style.css">
<style>
.angel-grid{display:grid;grid-template-columns:280px 1fr;grid-template-rows:1fr 200px;height:calc(100vh - 70px);gap:0}
@media(max-width:900px){.angel-grid{grid-template-columns:1fr}.git-side{display:none}}

.git-side{grid-row:1/3;background:#0f172a;border-left:1px solid #334155;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.git-side h3{font-size:12px;color:#7dd3fc;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.git-side h3::before{content:'◆';font-size:9px;color:#3b82f6}
.git-btn{background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:8px;padding:7px 11px;font-family:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.git-btn:hover{border-color:#3b82f6;background:#172033}
.git-btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.git-btn.full{width:100%}
.git-out{background:#050a15;border:1px solid #1e293b;border-radius:8px;padding:8px;font-family:Consolas,monospace;font-size:10.5px;color:#94a3b8;direction:ltr;text-align:left;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.git-row{display:flex;gap:6px;flex-wrap:wrap}

.chat-col{display:flex;flex-direction:column;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}

.msg-wrap{display:flex;flex-direction:column;max-width:80%;position:relative}
.msg-wrap.user{align-self:flex-start;align-items:flex-start}
.msg-wrap.bot{align-self:flex-end;align-items:flex-end}
.msg{padding:13px 17px;border-radius:14px;line-height:1.8;white-space:pre-wrap;font-size:14px;width:100%;word-wrap:break-word}
.msg.user{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-bottom-right-radius:4px}
.msg.bot{background:#1e293b;border:1px solid #334155;border-bottom-left-radius:4px}
.msg.bot pre{background:#050a15;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;direction:ltr;text-align:left;margin:8px 0;font-family:Consolas,monospace;border:1px solid #1e293b}
.msg.bot code{background:#050a15;padding:2px 5px;border-radius:4px;font-size:12px;direction:ltr;font-family:Consolas,monospace;color:#7dd3fc}
.msg .attachments{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);font-size:11px;opacity:.85}
.msg .attachments span{display:inline-block;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:6px;margin:2px}

.msg-actions{display:flex;gap:4px;margin-top:5px;opacity:0;transition:.2s}
.msg-wrap:hover .msg-actions{opacity:1}
.msg-actions button{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.msg-actions button:hover{color:#f1f5f9;border-color:#3b82f6}
.msg-actions button.liked{background:rgba(16,185,129,.2);color:#6ee7b7;border-color:#10b981}
.msg-actions button.disliked{background:rgba(239,68,68,.2);color:#fca5a5;border-color:#ef4444}

.tool-block{background:#050a15;border:1px solid #8b5cf6;border-radius:10px;padding:10px;margin:8px 0;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:11.5px}
.tool-block .tool-head{color:#c4b5fd;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tool-block .tool-body{color:#94a3b8;white-space:pre-wrap;max-height:200px;overflow:auto}
.tool-block .tool-actions{margin-top:8px;display:flex;gap:6px}
.tool-block .tool-actions button{background:#1e293b;border:1px solid #334155;color:#f1f5f9;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:10px;font-family:inherit}
.tool-block .tool-actions button.approve{background:#10b981;border-color:#10b981;color:#fff}

.chat-input-wrap{padding:12px 20px;background:#0b1220;border-top:1px solid #334155}
.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick-actions button{background:#1e293b;border:1px solid #334155;color:#94a3b8;font-family:inherit;font-size:11px;padding:5px 10px;border-radius:7px;cursor:pointer}
.quick-actions button:hover{color:#f1f5f9;border-color:#3b82f6}

.att-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.att-item{background:#1e293b;border:1px solid #334155;border-radius:9px;padding:4px 10px;font-size:11.5px;display:flex;align-items:center;gap:6px}
.att-item button{background:transparent;border:0;color:#ef4444;cursor:pointer;font-size:13px;padding:0}

.chat-input{display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:11px 15px;color:#f1f5f9;font-family:inherit;font-size:14px;resize:none;min-height:48px;max-height:160px}
.chat-input textarea:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.2s;flex-shrink:0;position:relative}
.icon-btn:hover{border-color:#3b82f6;background:#172033}
.icon-btn.voice.rec{border-color:#ef4444;background:rgba(239,68,68,.15);color:#fca5a5;animation:pulseRec 1.2s infinite}
@keyframes pulseRec{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.icon-btn.tts.on{background:#2563eb;border-color:#2563eb;color:#fff}
.send-btn{padding:0 20px;height:48px;border-radius:12px;background:#2563eb;color:#fff;border:0;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;flex-shrink:0}
.send-btn:hover:not(:disabled){background:#3b82f6}
.send-btn:disabled{opacity:.5;cursor:wait}

.thinking{display:inline-flex;gap:5px;align-items:center;padding:12px 18px;background:#1e293b;border-radius:14px;align-self:flex-end;border:1px solid #334155}
.thinking .dot{width:7px;height:7px;background:#7dd3fc;border-radius:50%;animation:blink 1.2s infinite}
.thinking .dot:nth-child(2){animation-delay:.2s}
.thinking .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.voice-status{position:fixed;bottom:24px;left:24px;background:rgba(239,68,68,.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;display:none;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.voice-status.on{display:flex;align-items:center;gap:10px}

/* Terminal */
.term-row{grid-column:1/3;background:#000;border-top:1px solid #334155;padding:8px 14px;font-family:Consolas,monospace;font-size:12px;overflow-y:auto;direction:ltr;text-align:left}
.term-line{display:flex;gap:8px;align-items:center;color:#4ade80}
.term-line .prompt{color:#facc15;white-space:nowrap}
.term-line input{flex:1;background:transparent;border:0;color:#4ade80;font-family:inherit;font-size:12px;outline:0;direction:ltr;text-align:left}
.term-out{color:#94a3b8;font-size:11px;white-space:pre-wrap;margin-top:6px;max-height:120px;overflow:auto}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #10b981;padding:10px 20px;border-radius:10px;font-size:13px;z-index:500;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-8px)}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo">Horizon Angel</div>
  <nav>
    <a href="index.html">خانه</a>
    <a href="store.html">فروشگاه</a>
    <a href="panel.html">پنل</a>
    <a href="control.html">مرکز کنترل</a>
    <a href="angel.html" class="active">هوش مصنوعی</a>
  </nav>
  <div class="live">Liara AI</div>
</header>

<div class="angel-grid">

  <!-- Git side -->
  <aside class="git-side">
    <h3>مخزن</h3>
    <span id="branch" style="font-size:11px;color:#6ee7b7;font-family:Consolas,monospace;direction:ltr">—</span>

    <h3>وضعیت</h3>
    <div class="git-out" id="status">(Refresh)</div>

    <h3>عملیات سریع</h3>
    <div class="git-row">
      <button class="git-btn" onclick="gitRefresh()" title="Refresh">🔄</button>
      <button class="git-btn" onclick="gitFetch()" title="Fetch">⬇</button>
      <button class="git-btn" onclick="gitPull()" title="Pull">⤓</button>
      <button class="git-btn" onclick="gitPush()" title="Push">⬆</button>
    </div>

    <h3>Commit</h3>
    <input class="git-input" id="commitMsg" placeholder="پیام کامیت..." style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:7px 11px;color:#f1f5f9;font-family:inherit;font-size:12px;width:100%">
    <input class="git-input" id="commitFiles" placeholder="فایل‌ها (با کاما)" style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:7px 11px;color:#f1f5f9;font-family:inherit;font-size:12px;width:100%">
    <button class="git-btn primary full" onclick="gitCommit()">✓ Commit</button>

    <h3>لاگ اخیر</h3>
    <div class="git-out" id="log">—</div>
  </aside>

  <!-- Chat -->
  <div class="chat-col">
    <div class="chat-log" id="chatLog">
      <div class="msg-wrap bot">
        <div class="msg bot">سلام آقای آملی مقدم. Horizon Angel با حافظه پایدار. می‌توانم: تحلیل، کد، فایل زیپ دریافت کنم، دستورات گیت اجرا کنم. همه چیز حفظ می‌شود.</div>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="quick-actions">
        <button onclick="quick('وضعیت مخزن را بگو')">📊 git status</button>
        <button onclick="quick('آخرین ۵ کامیت')">📜 log</button>
        <button onclick="quick('فایل cmd/switch/switch.go را بخوان')">📖 read file</button>
        <button onclick="clearHistory()">🗑 پاک کردن حافظه</button>
      </div>

      <div class="att-list" id="attList"></div>

      <div class="chat-input">
        <textarea id="input" placeholder="سوال، دستور، یا فایل... (Enter=ارسال)" rows="1"></textarea>
        <button class="icon-btn voice" id="voiceBtn" title="ویس فارسی">🎙️</button>
        <button class="icon-btn tts on" id="ttsBtn" title="صحبت AI">🔊</button>
        <label class="icon-btn" title="افزودن فایل" style="cursor:pointer">
          📎
          <input type="file" id="fileInput" multiple style="display:none">
        </label>
        <button class="send-btn" id="sendBtn" onclick="send()">ارسال</button>
      </div>
    </div>
  </div>

  <!-- Terminal -->
  <div class="term-row">
    <div class="term-line">
      <span class="prompt">horizon@repo:~$</span>
      <input id="termInput" placeholder="git status / git log / git diff / ..." />
    </div>
    <div class="term-out" id="termOut"></div>
  </div>

</div>

<div class="voice-status" id="voiceStatus">🎙️ در حال شنیدن...</div>
<div class="toast" id="toast"></div>

<script>
// ─── state ───
let history = [];
let attachments = [];
let ttsEnabled = true;
const chatLog = document.getElementById('chatLog');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

// ─── toast ───
const toastEl = document.getElementById('toast');
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('on'),2200)}

// ─── history (memory) ───
async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    const h = await r.json();
    if (Array.isArray(h) && h.length) {
      history = h;
      chatLog.innerHTML = '';
      for (const m of h) {
        if (m.role === 'user') addMsg('user', m.content);
        else addMsg('bot', m.content);
      }
      toast('حافظه بارگذاری شد (' + h.length + ' پیام)');
    }
  } catch(e) { console.error('load history', e); }
}

async function saveHistory() {
  try {
    await fetch('/api/history', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ history })
    });
  } catch(e) { console.error('save history', e); }
}

async function clearHistory() {
  if (!confirm('حافظه پاک شود؟')) return;
  await fetch('/api/history', { method: 'DELETE' });
  history = [];
  chatLog.innerHTML = '';
  addMsg('bot', 'حافظه پاک شد.');
}

// ─── messages ───
function addMsg(role, text, files) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role;
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;

  if (role === 'bot') msg.innerHTML = renderMd(text);
  else {
    msg.textContent = text;
    if (files && files.length) {
      const at = document.createElement('div');
      at.className = 'attachments';
      at.innerHTML = files.map(f => '<span>📎 ' + f.name + '</span>').join('');
      msg.appendChild(at);
    }
  }

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const copy = document.createElement('button');
  copy.textContent = '📋';
  copy.onclick = () => navigator.clipboard.writeText(text).then(() => toast('کپی شد'));
  actions.appendChild(copy);

  if (role === 'bot') {
    const like = document.createElement('button');
    like.textContent = '👍';
    like.onclick = () => { like.classList.toggle('liked'); toast('ثبت شد'); };
    actions.appendChild(like);
    const dislike = document.createElement('button');
    dislike.textContent = '👎';
    dislike.onclick = () => { dislike.classList.toggle('disliked'); toast('ثبت شد'); };
    actions.appendChild(dislike);
  }

  wrap.appendChild(msg);
  wrap.appendChild(actions);
  chatLog.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderMd(t) {
  let s = String(t).replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```tool([\s\S]*?)```/g, (_,c) => buildToolBlock(c.trim()));
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => '<pre>' + c.trim() + '</pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

let toolSeq = 0;
const toolRegistry = {};
function buildToolBlock(json) {
  let spec;
  try { spec = JSON.parse(json); } catch(e) { return '<pre>' + json + '</pre>'; }
  const id = 'tool_' + (++toolSeq);
  toolRegistry[id] = spec;
  const needsApproval = ['git_commit','git_push','write_file'].includes(spec.name);
  const argsText = JSON.stringify(spec.args || {}, null, 2).replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `
    <div class="tool-block" id="${id}">
      <div class="tool-head"><span>⚙️ ${spec.name}</span><span style="color:#94a3b8;font-size:10px">${needsApproval ? 'نیاز به تأیید' : 'خودکار'}</span></div>
      <div class="tool-body">${argsText}</div>
      <div class="tool-actions">
        <button class="${needsApproval ? 'approve' : ''}" onclick="runTool('${id}')">${needsApproval ? '✓ تأیید و اجرا' : '▶ اجرا'}</button>
        <button onclick="dismissTool('${id}')">لغو</button>
      </div>
    </div>`;
}

async function runTool(id) {
  const spec = toolRegistry[id];
  if (!spec) return;
  const el = document.getElementById(id);
  el.querySelector('.tool-actions').innerHTML = '<span style="color:#94a3b8;font-size:11px">در حال اجرا...</span>';
  try {
    const r = await fetch('/api/tools/run', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(spec)
    });
    const d = await r.json();
    const resultText = d.error ? ('❌ ' + d.error) : JSON.stringify(d.result, null, 2);
    el.querySelector('.tool-body').textContent = resultText;
    el.querySelector('.tool-actions').innerHTML = '<span style="color:#10b981;font-size:11px">✓ اجرا شد</span>';
    history.push({ role: 'user', content: `نتیجه ${spec.name}:\n\`\`\`\n${resultText}\n\`\`\`` });
    await saveHistory();
    await askAI('', []);
  } catch(e) {
    el.querySelector('.tool-body').textContent = '❌ ' + e;
  }
}

function dismissTool(id) {
  const el = document.getElementById(id);
  if (el) el.querySelector('.tool-actions').innerHTML = '<span style="color:#94a3b8;font-size:11px">لغو شد</span>';
}

// ─── voice input ───
let recognition = null, isRec = false;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onresult = e => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
    input.value = t;
  };
  recognition.onerror = () => stopRec();
  recognition.onend = () => stopRec();

  const voiceBtn = document.getElementById('voiceBtn');
  voiceBtn.onclick = () => {
    if (isRec) { recognition.stop(); return; }
    recognition.start();
    isRec = true;
    voiceBtn.classList.add('rec');
    document.getElementById('voiceStatus').classList.add('on');
  };
}
function stopRec() {
  isRec = false;
  document.getElementById('voiceBtn').classList.remove('rec');
  document.getElementById('voiceStatus').classList.remove('on');
  if (input.value.trim()) setTimeout(send, 400);
}

// ─── TTS ───
const ttsBtn = document.getElementById('ttsBtn');
ttsBtn.classList.add('on');
ttsBtn.onclick = () => {
  ttsEnabled = !ttsEnabled;
  ttsBtn.classList.toggle('on', ttsEnabled);
  if (!ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
  toast(ttsEnabled ? 'صحبت روشن' : 'صحبت خاموش');
};

function speak(text) {
  if (!ttsEnabled) return;
  let clean = String(text)
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/^#+ /gm, '')
    .replace(/[📎📋👍👎⚙️▶✓❌⚠️🔊🎙️📊📁📜📖🔐💻⛓️◆]/g, '')
    .replace(/\n+/g, '. ')
    .trim();
  if (!clean) return;
  clean = clean.slice(0, 190);
  
  // Try native Persian voice first
  const voices = window.speechSynthesis.getVoices();
  const faVoice = voices.find(v => v.lang === 'fa-IR') || voices.find(v => v.lang.startsWith('fa'));
  if (faVoice) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'fa-IR';
    u.voice = faVoice;
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
    return;
  }
  
  // Fallback: Google Translate TTS
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(clean) + '&tl=fa&client=tw-ob';
  const audio = new Audio(url);
  audio.play().catch(e => console.error('TTS failed:', e));
}

// ─── attachments ───
document.getElementById('fileInput').addEventListener('change', async e => {
  for (const file of e.target.files) {
    const isZip = file.name.toLowerCase().endsWith('.zip');
    const isText = /\.(txt|md|json|js|ts|go|py|yaml|yml|csv|log|html|css|sh|env)$/i.test(file.name);
    const isImage = /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(file.name);

    const reader = new FileReader();
    reader.onload = async ev => {
      const data = {
        name: file.name,
        size: file.size,
        isZip,
        isImage,
        content: null,
        listing: null,
        files: null,
      };

      if (isText && file.size < 500000) {
        data.content = ev.target.result;
      } else if (isZip) {
        // upload to server for extraction
        const base64 = ev.target.result.split(',')[1];
        try {
          const r = await fetch('/api/upload', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ name: file.name, content: base64, isBase64: true })
          });
          const d = await r.json();
          if (d.isZip) {
            data.listing = d.listing;
            data.files = d.files;
            data.summary = `${d.listing.length} فایل — ${d.files.filter(f=>f.content).length} متنی`;
          }
        } catch(err) { console.error('zip upload failed', err); }
      }

      attachments.push(data);
      renderAtt();
      document.getElementById('fileInput').value = '';
    };

    if (isText) reader.readAsText(file);
    else reader.readAsDataURL(file);
  }
});

function renderAtt() {
  document.getElementById('attList').innerHTML = attachments.map((f,i) =>
    `<div class="att-item">${f.isZip?'📦':f.isImage?'🖼':'📎'} ${f.name} <span style="color:#94a3b8">(${Math.round(f.size/1024)}KB)</span> <button onclick="removeAtt(${i})">✕</button></div>`
  ).join('');
}

function removeAtt(i) { attachments.splice(i, 1); renderAtt(); }

// ─── send ───
async function send() {
  const text = input.value.trim();
  if (!text && !attachments.length) return;

  const files = [...attachments];
  input.value = '';
  attachments = [];
  renderAtt();
  sendBtn.disabled = true;

  const attachSummary = files.map(f => f.summary || f.name).join(', ');
  addMsg('user', text || ('(فایل: ' + attachSummary + ')'), files);
  history.push({ role: 'user', content: text || '(فایل)' });
  await saveHistory();

  await askAI(text, files);
  sendBtn.disabled = false;
  input.focus();
}

async function askAI(text, files) {
  const think = document.createElement('div');
  think.className = 'thinking';
  think.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  chatLog.appendChild(think);
  think.scrollIntoView({ behavior: 'smooth', block: 'end' });

  // flatten files for the API
  const flatFiles = [];
  if (files) {
    for (const f of files) {
      if (f.files && f.files.length) {
        // ZIP: send each file
        for (const inner of f.files) {
          flatFiles.push({ name: f.name + '/' + inner.name, size: inner.size, content: inner.content });
        }
      } else {
        flatFiles.push({ name: f.name, size: f.size, content: f.content });
      }
    }
  }

  try {
    const r = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, history: history.slice(0,-1), files: flatFiles })
    });
    const d = await r.json();
    think.remove();
    if (d.error) {
      addMsg('bot', '❌ ' + d.error);
    } else {
      addMsg('bot', d.reply);
      history.push({ role: 'assistant', content: d.reply });
      await saveHistory();
      speak(d.reply);
    }
  } catch(e) {
    think.remove();
    addMsg('bot', '❌ ' + e);
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function quick(t) { input.value = t; input.focus(); }

// ─── git side ───
async function gitCall(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  return r.json();
}
async function gitRefresh() {
  const d = await gitCall('/api/git/cmd', { cmd: 'git status' });
  const b = await gitCall('/api/git/cmd', { cmd: 'git branch --show-current' });
  const l = await gitCall('/api/git/cmd', { cmd: 'git log -5 --oneline' });
  document.getElementById('branch').textContent = b.stdout?.trim() || '—';
  document.getElementById('status').textContent = d.stdout || '(clean)';
  document.getElementById('log').textContent = l.stdout || '—';
}
async function gitFetch() { const d = await gitCall('/api/tools/run', { name:'git_fetch', args:{} }); toast('fetch'); gitRefresh(); }
async function gitPull()  { const d = await gitCall('/api/tools/run', { name:'git_pull', args:{} }); toast(d.result?.stdout || 'pull done'); gitRefresh(); }
async function gitPush()  {
  if (!confirm('push؟')) return;
  const d = await gitCall('/api/tools/run', { name:'git_push', args:{} });
  toast(d.result?.stderr || 'push done');
}
async function gitCommit() {
  const msg = document.getElementById('commitMsg').value.trim();
  const files = document.getElementById('commitFiles').value.split(',').map(s=>s.trim()).filter(Boolean);
  if (!msg || !files.length) return toast('پیام و فایل‌ها لازم است');
  if (!confirm('commit؟\n' + files.join('\n') + '\n\n' + msg)) return;
  const d = await gitCall('/api/tools/run', { name:'git_commit', args:{ message: msg, files } });
  toast(d.error || 'commit done');
  gitRefresh();
}

// ─── terminal ───
const termInput = document.getElementById('termInput');
const termOut = document.getElementById('termOut');
termInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const cmd = e.target.value.trim();
  e.target.value = '';
  if (!cmd) return;
  termOut.textContent = '$ ' + cmd + '\n...';
  try {
    const r = await fetch('/api/git/cmd', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ cmd: cmd.startsWith('git ') ? cmd : ('git ' + cmd) })
    });
    const d = await r.json();
    termOut.textContent = '$ ' + cmd + '\n' + (d.stdout || d.stderr || '(no output)');
  } catch(err) {
    termOut.textContent = '$ ' + cmd + '\n❌ ' + err;
  }
});

// ─── boot ───
loadHistory();
gitRefresh();
input.focus();
