<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Horizon Core — System Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0a0e1a;color:#e6edf3;padding:20px;min-height:100vh}
  .wrap{max-width:1400px;margin:0 auto}
  h1{color:#58a6ff;font-size:22px;margin-bottom:4px}
  .sub{color:#8b949e;font-size:13px;margin-bottom:24px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:24px}
  .node{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;position:relative;transition:0.2s}
  .node:hover{border-color:#58a6ff}
  .node.online{border-color:#3fb950;box-shadow:0 0 12px rgba(63,185,80,0.15)}
  .node.offline{border-color:#f85149;opacity:0.7}
  .node.checking{border-color:#d29922}
  .node-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .node-name{font-size:15px;font-weight:600;color:#e6edf3}
  .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}
  .dot-on{background:#3fb950;box-shadow:0 0 8px #3fb950}
  .dot-off{background:#f85149}
  .dot-wait{background:#d29922;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .node-row{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;padding:6px 0;border-bottom:1px solid #21262d}
  .node-row:last-child{border:none}
  .node-val{color:#e6edf3;direction:ltr;text-align:left;font-family:monospace;font-size:11px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge-on{background:#0d419d33;color:#79c0ff;border:1px solid #1f6feb}
  .badge-off{background:#5d1a1a33;color:#ff7b72;border:1px solid #f85149}
  .badge-warn{background:#5c4a0033;color:#e3b341;border:1px solid #d29922}

  .toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
  button{background:#238636;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{background:#2ea043}
  .toolbar-time{margin-right:auto;color:#8b949e;font-size:12px}

  h2{color:#c084fc;font-size:14px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #30363d}

  .summary{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;margin-bottom:20px}
  .summary-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .stat{text-align:center;padding:10px;background:#0d1117;border-radius:6px}
  .stat-num{font-size:24px;font-weight:700;color:#58a6ff}
  .stat-label{font-size:11px;color:#8b949e;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔭 Horizon Core — System Panel</h1>
  <div class="sub">نمای کامل همه سرویس‌ها · online و offline · آدرس‌های localhost</div>

  <div class="summary">
    <div class="summary-stats">
      <div class="stat"><div class="stat-num" id="cnt-online">—</div><div class="stat-label">Online</div></div>
      <div class="stat"><div class="stat-num" id="cnt-offline">—</div><div class="stat-label">Offline</div></div>
      <div class="stat"><div class="stat-num" id="cnt-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" id="chain-height">—</div><div class="stat-label">Height</div></div>
      <div class="stat"><div class="stat-num" id="chain-tx">—</div><div class="stat-label">TX</div></div>
      <div class="stat"><div class="stat-num" id="chain-tps">—</div><div class="stat-label">TPS</div></div>
    </div>
  </div>

  <div class="toolbar">
    <button onclick="refreshAll()">🔄 Refresh</button>
    <span class="toolbar-time" id="last-update">—</span>
  </div>

  <h2>🌐 Online Side — PostgreSQL + Backend</h2>
  <div class="grid" id="grid-online"></div>

  <h2>📴 Offline Side — SQLite + Switch</h2>
  <div class="grid" id="grid-offline"></div>

  <h2>🛠 Infrastructure</h2>
  <div class="grid" id="grid-infra"></div>
</div>

<script>
const SERVICES = {
  online: [
    { id:'backend',   name:'Backend API',      url:'http://localhost:8080/api/v1/health',   addr:'localhost:8080', kind:'HTTP' },
    { id:'postgres',  name:'PostgreSQL',        url:'http://localhost:8080/api/v1/db/status', addr:'localhost:5432', kind:'PSQL', optional:true },
    { id:'chain',     name:'Chain State',       url:'http://localhost:8080/api/v1/chain/info', addr:'localhost:8080', kind:'DATA' },
    { id:'packages',  name:'Commerce (API)',    url:'http://localhost:8080/api/v1/packages',  addr:'localhost:8080', kind:'DATA' },
  ],
  offline: [
    { id:'switch',    name:'Switch API',        url:'http://localhost:8090/api/v1/health',    addr:'localhost:8090', kind:'HTTP' },
    { id:'switch-enf',name:'License Enforce',   url:'http://localhost:8090/api/v1/license/enforce/status', addr:'localhost:8090', kind:'DATA' },
    { id:'switch-lic',name:'License List',      url:'http://localhost:8090/api/v1/license/list', addr:'localhost:8090', kind:'DATA' },
    { id:'accounts',  name:'Switch Accounts',   url:'http://localhost:8090/api/v1/account/list', addr:'localhost:8090', kind:'DATA' },
  ],
  infra: [
    { id:'gitea',     name:'Gitea',             url:'http://localhost:3000/api/v1/version',   addr:'localhost:3000', kind:'HTTP' },
    { id:'tunnel',    name:'Tunnel (cloudflared)', url:'http://localhost:20241/ready',        addr:'localhost:20241', kind:'METRICS', optional:true },
    { id:'metrics',   name:'Metrics Server',    url:'http://localhost:20243/metrics',         addr:'localhost:20243', kind:'METRICS', optional:true },
  ]
};

let lastChainInfo = null;

async function probe(svc) {
  const t0 = performance.now();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(svc.url, { signal: ctrl.signal, mode: 'cors' });
    clearTimeout(timer);
    const txt = await r.text();
    const ms = Math.round(performance.now() - t0);
    let data = null;
    try { data = JSON.parse(txt); } catch(e) { data = txt.slice(0, 100); }
    return { ok: r.ok, status: r.status, ms, data };
  } catch(e) {
    return { ok: false, status: 0, ms: Math.round(performance.now() - t0), error: e.message };
  }
}

function renderNode(svc, result) {
  const cls = result.ok ? 'online' : (result.error ? 'offline' : 'checking');
  const dot = result.ok ? 'dot-on' : (result.error ? 'dot-off' : 'dot-wait');
  const badge = result.ok ? '<span class="badge badge-on">ONLINE</span>' :
                (result.error ? '<span class="badge badge-off">DOWN</span>' :
                                 '<span class="badge badge-warn">CHECK</span>');

  let details = '';
  if (result.ok && typeof result.data === 'object' && result.data) {
    const keys = Object.keys(result.data).slice(0, 4);
    keys.forEach(k => {
      let v = result.data[k];
      if (typeof v === 'object') v = JSON.stringify(v).slice(0, 40) + '…';
      if (typeof v === 'string' && v.length > 50) v = v.slice(0, 50) + '…';
      details += `<div class="node-row"><span>${k}</span><span class="node-val">${v}</span></div>`;
    });
  } else if (result.error) {
    details += `<div class="node-row"><span>error</span><span class="node-val">${result.error.slice(0,60)}</span></div>`;
  }

  return `
    <div class="node ${cls}">
      <div class="node-head">
        <div><span class="status-dot ${dot}"></span><span class="node-name">${svc.name}</span></div>
        ${badge}
      </div>
      <div class="node-row"><span>Address</span><span class="node-val">${svc.addr}</span></div>
      <div class="node-row"><span>Kind</span><span class="node-val">${svc.kind}</span></div>
      <div class="node-row"><span>Latency</span><span class="node-val">${result.ms}ms</span></div>
      ${details}
    </div>`;
}

async function refreshGroup(groupId, services) {
  const grid = document.getElementById(groupId);
  grid.innerHTML = services.map(s => renderNode(s, { ok:false, ms:0 })).join('');
  const results = await Promise.all(services.map(s => probe(s)));
  grid.innerHTML = services.map((s, i) => renderNode(s, results[i])).join('');
  return results;
}

async function refreshAll() {
  document.getElementById('last-update').textContent = 'در حال بررسی...';

  const [online, offline, infra] = await Promise.all([
    refreshGroup('grid-online', SERVICES.online),
    refreshGroup('grid-offline', SERVICES.offline),
    refreshGroup('grid-infra', SERVICES.infra),
  ]);

  const all = [...online, ...offline, ...infra];
  const ok = all.filter(r => r.ok).length;
  document.getElementById('cnt-online').textContent  = ok;
  document.getElementById('cnt-offline').textContent = all.length - ok;
  document.getElementById('cnt-total').textContent   = all.length;

  // Chain stats from the chain/info node
  const chainRes = online[2];
  if (chainRes && chainRes.ok && typeof chainRes.data === 'object') {
    document.getElementById('chain-height').textContent = chainRes.data.height || '—';
    document.getElementById('chain-tx').textContent = chainRes.data.tx_total || '—';
  } else {
    document.getElementById('chain-height').textContent = '—';
    document.getElementById('chain-tx').textContent = '—';
  }

  // TPS: read from a saved value if exists
  document.getElementById('chain-tps').textContent =
    localStorage.getItem('horizon_last_tps') || '—';

  document.getElementById('last-update').textContent =
    'آخرین به‌روزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
}

refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
