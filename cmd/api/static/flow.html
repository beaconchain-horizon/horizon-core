<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Horizon Core — Live Data Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#05070e;color:#e6edf3;overflow:hidden;height:100vh;display:flex;flex-direction:column}

  .topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#0d1117;border-bottom:1px solid #30363d}
  .topbar h1{font-size:15px;color:#58a6ff}
  .topbar .sub{color:#8b949e;font-size:11px}
  .topbar .stats{display:flex;gap:14px;margin-right:auto;font-size:12px}
  .topbar .stat span:first-child{color:#8b949e;margin-left:4px}
  .topbar .stat span:last-child{color:#e6edf3;font-weight:700;font-family:monospace}
  .toolbar{margin-right:8px;display:flex;gap:8px;align-items:center}
  .toolbar input{padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-family:monospace;font-size:11px;width:180px;direction:ltr}
  .toolbar button{background:#238636;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
  .toolbar button:hover{background:#2ea043}

  .main{flex:1;display:flex;overflow:hidden}

  .canvas-wrap{flex:1;position:relative;background:radial-gradient(circle at 50% 50%, #0a1428 0%, #05070e 70%)}
  canvas{display:block;width:100%;height:100%}

  .legend{position:absolute;top:12px;left:12px;background:rgba(13,17,23,0.9);border:1px solid #30363d;border-radius:8px;padding:10px 12px;font-size:11px}
  .legend-item{display:flex;align-items:center;gap:6px;margin:4px 0}
  .legend-dot{width:8px;height:8px;border-radius:50%}

  .log{width:380px;background:#0d1117;border-right:1px solid #30363d;overflow-y:auto;font-family:monospace;font-size:11px;direction:ltr}
  .log-head{position:sticky;top:0;background:#161b22;padding:10px 12px;border-bottom:1px solid #30363d;color:#8b949e;font-family:-apple-system,sans-serif;font-size:12px;direction:rtl}
  .log-row{padding:8px 12px;border-bottom:1px solid #161b22;line-height:1.5}
  .log-row.ok{border-left:3px solid #3fb950}
  .log-row.err{border-left:3px solid #f85149;background:rgba(248,81,73,0.05)}
  .log-time{color:#6e7681}
  .log-svc{color:#58a6ff;font-weight:600}
  .log-url{color:#8b949e}
  .log-status{color:#3fb950;font-weight:700}
  .log-status.err{color:#f85149}
  .log-data{color:#c084fc;margin-top:2px;white-space:pre-wrap;word-break:break-all;max-height:60px;overflow:hidden}
</style>
</head>
<body>

<div class="topbar">
  <h1>🔭 Horizon Core — Live Data Flow</h1>
  <span class="sub">جریان داده در زمان واقعی</span>
  <div class="toolbar">
    <input id="token" type="password" placeholder="ADMIN_TOKEN">
    <button onclick="saveToken()">🔑</button>
    <button onclick="toggleProbe()" id="btn-toggle">⏸ توقف</button>
  </div>
  <div class="stats">
    <div class="stat"><span>OK:</span><span id="st-ok">0</span></div>
    <div class="stat"><span>FAIL:</span><span id="st-fail">0</span></div>
    <div class="stat"><span>Height:</span><span id="st-height">—</span></div>
    <div class="stat"><span>TX:</span><span id="st-tx">—</span></div>
    <div class="stat"><span>TPS:</span><span id="st-tps">—</span></div>
  </div>
</div>

<div class="main">
  <div class="log" id="log">
    <div class="log-head">📡 جریان درخواست‌ها</div>
  </div>
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>موفق (2xx)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>شکست</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d29922"></div>در حال ارسال</div>
      <div class="legend-item" style="margin-top:8px;color:#8b949e">نقطه‌ها = درخواست‌های زنده</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// Configuration
// ═══════════════════════════════════════════════════════════
const ADMIN_TOKEN = () => localStorage.getItem('hz_panel_token') || '';
const PROBE_INTERVAL = 3000;

function saveToken() {
  const t = document.getElementById('token').value;
  localStorage.setItem('hz_panel_token', t);
  addLog('AUTH', 'token updated', 'ok', 'length=' + t.length);
}
document.getElementById('token').value = ADMIN_TOKEN();

// ═══════════════════════════════════════════════════════════
// Nodes — positions in canvas (0..1 normalized)
// ═══════════════════════════════════════════════════════════
const NODES = {
  browser:   { x: 0.10, y: 0.15, label: 'Browser',      kind: 'client',  color: '#58a6ff' },
  backend:   { x: 0.35, y: 0.35, label: 'Backend :8080', kind: 'api',    color: '#58a6ff' },
  postgres:  { x: 0.65, y: 0.15, label: 'PostgreSQL',    kind: 'db-on',  color: '#79c0ff' },
  chain:     { x: 0.65, y: 0.55, label: 'Chain DB',      kind: 'db-on',  color: '#79c0ff' },
  switch:    { x: 0.35, y: 0.75, label: 'Switch :8090',  kind: 'api',    color: '#c084fc' },
  sqlite:    { x: 0.65, y: 0.95, label: 'SQLite .db',    kind: 'db-off', color: '#c084fc' },
  usb:       { x: 0.10, y: 0.55, label: 'USB Key',       kind: 'airgap', color: '#d29922' },
  verifier:  { x: 0.10, y: 0.90, label: 'verify-tx',     kind: 'tool',   color: '#3fb950' },
  cloudflare:{ x: 0.90, y: 0.35, label: 'Cloudflare',    kind: 'tunnel', color: '#d29922' },
  gitea:     { x: 0.90, y: 0.75, label: 'Gitea :3000',   kind: 'infra',  color: '#6e7681' },
};

const EDGES = [
  { from: 'browser',    to: 'backend',    label: 'HTTP' },
  { from: 'backend',    to: 'postgres',   label: 'PSQL' },
  { from: 'backend',    to: 'chain',      label: 'DATA' },
  { from: 'backend',    to: 'switch',     label: 'SYNC' },
  { from: 'switch',     to: 'sqlite',     label: 'file' },
  { from: 'usb',        to: 'switch',     label: 'sign' },
  { from: 'verifier',   to: 'chain',      label: 'proof' },
  { from: 'cloudflare', to: 'backend',    label: 'edge' },
  { from: 'gitea',      to: 'browser',    label: 'repo' },
];

// ═══════════════════════════════════════════════════════════
// Requests to probe (mapped to a path in the graph)
// ═══════════════════════════════════════════════════════════
const PROBES = [
  { name: 'Backend health',  url: 'http://localhost:8080/api/v1/health',
    path: ['browser','backend'], auth: false },
  { name: 'Chain info',      url: 'http://localhost:8091/api/v1/chain/info',
    path: ['browser','switch','chain'], auth: true, extract: 'chain' },
  { name: 'Packages',        url: 'http://localhost:8080/api/v1/packages',
    path: ['browser','backend','postgres'], auth: false },
  { name: 'Switch health',   url: 'http://localhost:8091/api/v1/health',
    path: ['browser','switch'], auth: false },
  { name: 'Switch enforce',  url: 'http://localhost:8091/api/v1/license/enforce/status',
    path: ['browser','switch','sqlite'], auth: true },
  { name: 'Switch license',  url: 'http://localhost:8091/api/v1/license/list',
    path: ['browser','switch','sqlite'], auth: true },
  { name: 'Switch accounts', url: 'http://localhost:8091/api/v1/account/list',
    path: ['browser','switch','sqlite'], auth: true },
];

// ═══════════════════════════════════════════════════════════
// Particles — animated dots
// ═══════════════════════════════════════════════════════════
const particles = [];

function spawnParticle(path, ok) {
  // path is array of node names — animate dot along the sequence
  const segs = [];
  for (let i = 0; i < path.length - 1; i++) segs.push([path[i], path[i+1]]);
  particles.push({
    segs,
    segIdx: 0,
    t: 0,
    speed: 0.02 + Math.random() * 0.008,
    ok,
    age: 0,
  });
}

// ═══════════════════════════════════════════════════════════
// Canvas
// ═══════════════════════════════════════════════════════════
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  W = cv.width = r.width * window.devicePixelRatio;
  H = cv.height = r.height * window.devicePixelRatio;
  cv.style.width = r.width + 'px';
  cv.style.height = r.height + 'px';
  ctx.scale(1, 1);
}
window.addEventListener('resize', resize);

function nodeXY(id) {
  const n = NODES[id];
  return { x: n.x * W, y: n.y * H };
}

// ═══════════════════════════════════════════════════════════
// Draw
// ═══════════════════════════════════════════════════════════
const nodeStatus = {}; // id -> 'ok' | 'err' | null
let pulse = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);
  pulse += 0.02;

  // Edges (grid lines)
  ctx.lineWidth = 1;
  EDGES.forEach(e => {
    const a = nodeXY(e.from), b = nodeXY(e.to);
    ctx.strokeStyle = '#21262d';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.segIdx >= p.segs.length) { particles.splice(i,1); continue; }
    const seg = p.segs[p.segIdx];
    const a = nodeXY(seg[0]), b = nodeXY(seg[1]);
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    const color = p.ok ? '#3fb950' : '#f85149';
    ctx.shadowBlur = 12;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 5 * window.devicePixelRatio, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    p.t += p.speed;
    if (p.t >= 1) { p.t = 0; p.segIdx++; }
  }

  // Nodes
  Object.entries(NODES).forEach(([id, n]) => {
    const x = n.x * W, y = n.y * H;
    const status = nodeStatus[id];
    let ringColor = n.color;
    if (status === 'ok')  ringColor = '#3fb950';
    if (status === 'err') ringColor = '#f85149';

    const r = 22 * window.devicePixelRatio;

    // Glow
    ctx.shadowBlur = status ? 20 : 8;
    ctx.shadowColor = ringColor;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = '#0d1117';
    ctx.fill();
    ctx.lineWidth = 2 * window.devicePixelRatio;
    ctx.strokeStyle = ringColor;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Pulse for active status
    if (status) {
      const pr = r + (Math.sin(pulse) + 1) * 3 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.arc(x, y, pr, 0, Math.PI*2);
      ctx.strokeStyle = ringColor + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Label
    ctx.font = (12 * window.devicePixelRatio) + 'px -apple-system, "Segoe UI", Tahoma, sans-serif';
    ctx.fillStyle = '#e6edf3';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(n.label, x, y + r + 6 * window.devicePixelRatio);
  });

  requestAnimationFrame(draw);
}

// ═══════════════════════════════════════════════════════════
// Log
// ═══════════════════════════════════════════════════════════
const logEl = document.getElementById('log');
let logCount = 0;

function addLog(svc, url, kind, data) {
  const row = document.createElement('div');
  row.className = 'log-row ' + (kind === 'ok' ? 'ok' : (kind === 'err' ? 'err' : ''));
  const t = new Date().toLocaleTimeString('en-GB');
  const statusColor = kind === 'ok' ? '#3fb950' : (kind === 'err' ? '#f85149' : '#d29922');
  row.innerHTML =
    '<span class="log-time">' + t + '</span> ' +
    '<span class="log-svc">' + svc + '</span> ' +
    '<span class="log-status" style="color:' + statusColor + '">' + (kind === 'ok' ? 'OK' : kind.toUpperCase()) + '</span><br>' +
    '<span class="log-url">' + url + '</span>' +
    (data ? '<div class="log-data">' + data.slice(0, 300) + '</div>' : '');
  logEl.appendChild(row);
  logCount++;
  // keep last 200
  while (logEl.children.length > 201) logEl.removeChild(logEl.children[1]);
  logEl.scrollTop = logEl.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// Probe
// ═══════════════════════════════════════════════════════════
let okCount = 0, failCount = 0;
let running = true;

async function probeOne(p) {
  // mark nodes as "in flight"
  p.path.forEach(id => { if (!nodeStatus[id]) nodeStatus[id] = null; });

  const opts = { method: 'GET', mode: 'cors', cache: 'no-store' };
  if (p.auth && ADMIN_TOKEN()) {
    opts.headers = { 'X-Admin-Token': ADMIN_TOKEN() };
  }
  const t0 = performance.now();
  let ok = false, status = 0, body = '';
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(p.url, { ...opts, signal: ctrl.signal });
    clearTimeout(to);
    status = r.status;
    ok = r.ok;
    body = await r.text();
  } catch (e) {
    status = 0;
    body = e.message;
  }
  const ms = Math.round(performance.now() - t0);

  // animate
  spawnParticle(p.path, ok);

  // mark end node
  const endNode = p.path[p.path.length - 1];
  nodeStatus[endNode] = ok ? 'ok' : 'err';

  // log
  addLog(p.name, p.url.replace(/^https?:\/\//, '') + ' → ' + status + ' (' + ms + 'ms)',
         ok ? 'ok' : 'err', body.slice(0, 250));

  if (ok) okCount++; else failCount++;
  document.getElementById('st-ok').textContent = okCount;
  document.getElementById('st-fail').textContent = failCount;

  // extract chain info
  if (ok && p.extract === 'chain') {
    try {
      const j = JSON.parse(body);
      document.getElementById('st-height').textContent = j.height || '—';
      document.getElementById('st-tx').textContent = j.tx_total || '—';
    } catch(e) {}
  }
}

async function probeAll() {
  if (!running) return;
  await Promise.all(PROBES.map(p => probeOne(p).catch(()=>{})));
}

function toggleProbe() {
  running = !running;
  document.getElementById('btn-toggle').textContent = running ? '⏸ توقف' : '▶ شروع';
  if (running) probeAll();
}

// ═══════════════════════════════════════════════════════════
// Start
// ═══════════════════════════════════════════════════════════
resize();
draw();
probeAll();
setInterval(probeAll, PROBE_INTERVAL);
</script>
</body>
</html>
