<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Horizon Agent Explorer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #58a6ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #30363d; text-align: left; }
        th { background: #161b22; color: #8b949e; }
        tr:hover { background: #161b22; }
        .badge { background: #238636; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Horizon Agent Network</h1>
        <p>Live status of all registered agents.</p>
        <table>
            <thead>
                <tr>
                    <th>Agent ID</th>
                    <th>User ID</th>
                    <th>Role</th>
                    <th>License ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="agent-list">
                <tr><td colspan="5">Loading agents...</td></tr>
            </tbody>
        </table>
    </div>
    <script>
        async function fetchAgents() {
            try {
                const res = await fetch('http://localhost:8080/api/v1/agents');
                const data = await res.json();
                const tbody = document.getElementById('agent-list');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No agents registered yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(a => `
                    <tr>
                        <td>${a.agent_id}</td>
                        <td>${a.user_id}</td>
                        <td><span class="badge">${a.role}</span></td>
                        <td>${a.license_id}</td>
                        <td style="color:#3fb950;">${a.status}</td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('agent-list').innerHTML = '<tr><td colspan="5">Error connecting to backend.</td></tr>';
            }
        }
        fetchAgents();
        setInterval(fetchAgents, 3000);
    </script>
</body>
</html>
